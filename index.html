<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OOP Dungeon Escape — Graphical + Text UI</title>
  <style>
    body {
      margin: 0; background: #0f1117; color: #e2e8f0;
      font-family: 'Courier New', monospace;
      display: flex; justify-content: center; padding: 20px;
    }
    .game-shell {
      width: 860px; background: #181b24; border: 2px solid #2e3446;
      border-radius: 10px; overflow: hidden; box-shadow: 0 12px 35px rgba(0,0,0,0.6);
    }
    .hud {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 18px; background: #12141c; border-bottom: 1px solid #2e3446;
    }
    .hp-bar-wrap { width: 220px; height: 16px; background: #2a1a1f; border-radius: 8px; overflow: hidden; }
    .hp-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #dc2626, #22c55e); transition: width 0.3s; }
    #sceneCanvas { display: block; width: 100%; height: 240px; background: #090b10; }
    .log-box {
      height: 220px; overflow-y: auto; padding: 14px 18px;
      background: #141720; line-height: 1.5; font-size: 14px; white-space: pre-wrap;
    }
    .quick-actions {
      display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 18px;
      background: #12141c; border-top: 1px solid #2e3446;
    }
    button {
      background: #252b3b; color: #f8fafc; border: 1px solid #3b445e;
      padding: 6px 12px; border-radius: 5px; cursor: pointer; font-family: inherit;
    }
    button:hover { background: #374158; }
    .cmd-bar { display: flex; border-top: 1px solid #2e3446; }
    .cmd-bar span { padding: 12px; color: #38bdf8; font-weight: bold; }
    .cmd-bar input {
      flex: 1; background: transparent; border: none; color: #fff;
      font-family: inherit; font-size: 15px; outline: none;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="hud">
      <div><strong id="roomTitle">Damp Dungeon Cell</strong></div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span>HP: <strong id="hpText">100</strong>/100</span>
        <div class="hp-bar-wrap"><div class="hp-bar-fill" id="hpFill"></div></div>
      </div>
      <div>Room: <span id="roomCode">cell</span></div>
    </div>

    <canvas id="sceneCanvas" width="860" height="240"></canvas>
    <div class="log-box" id="storyLog"></div>

    <div class="quick-actions">
      <button onclick="runCmd('take')">Take Item</button>
      <button onclick="runCmd('search')">Search Room</button>
      <button onclick="runCmd('use herb')">Use Herb</button>
      <button onclick="runCmd('door')">Open Gate</button>
      <button onclick="runCmd('north')">Go North</button>
      <button onclick="runCmd('south')">Go South</button>
      <button onclick="runCmd('inventory')">Inventory</button>
    </div>

    <form class="cmd-bar" onsubmit="event.preventDefault(); submitInput();">
      <span>&gt;</span>
      <input id="cmdInput" type="text" placeholder="Type a command (e.g., take, search, dodge, north, towel)..." autocomplete="off" />
    </form>
  </div>

  <script src="dungeon.js"></script>
  <script>
    const canvas = document.getElementById('sceneCanvas');
    const ctx = canvas.getContext('2d');
    const logEl = document.getElementById('storyLog');

    const roomNames = {
      cell: 'Damp Dungeon Cell',
      corridor: 'Trapped Gallery',
      gate: 'Moonlit Threshold'
    };

    function drawRoomVisual(roomId, hasTorch) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const bg = ctx.createLinearGradient(0, 0, 0, 240);
      bg.addColorStop(0, roomId === 'gate' ? '#16213e' : '#11131a');
      bg.addColorStop(1, '#1e222d');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#3b4254';
      ctx.lineWidth = 6;
      ctx.strokeRect(180, 25, 500, 195);

      if (roomId === 'cell') {
        ctx.strokeStyle = '#64748b';
        for (let x = 220; x <= 640; x += 45) {
          ctx.beginPath(); ctx.moveTo(x, 25); ctx.lineTo(x, 220); ctx.stroke();
        }
      } else if (roomId === 'corridor') {
        ctx.strokeStyle = '#475569';
        ctx.strokeRect(310, 65, 240, 120);
        ctx.fillStyle = '#7f1d1d';
        ctx.fillRect(360, 192, 140, 14);
      } else if (roomId === 'gate') {
        ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
        ctx.fillRect(330, 40, 200, 175);
        ctx.strokeStyle = '#38bdf8';
        ctx.strokeRect(330, 40, 200, 175);
      }

      if (hasTorch) {
        const glow = ctx.createRadialGradient(130, 110, 10, 130, 110, 180);
        glow.addColorStop(0, 'rgba(251, 146, 60, 0.45)');
        glow.addColorStop(1, 'rgba(251, 146, 60, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    function appendLog(text) {
      logEl.textContent += text + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    }

    function syncHud() {
      const roomId = Module.ccall('current_room', 'string', [], []);
      const hp = Module.ccall('current_hp', 'number', [], []);
      const torch = Module.ccall('has_torch_flag', 'number', [], []) === 1;

      document.getElementById('roomTitle').textContent = roomNames[roomId] || roomId;
      document.getElementById('roomCode').textContent = roomId;
      document.getElementById('hpText').textContent = hp;
      document.getElementById('hpFill').style.width = Math.max(0, Math.min(100, hp)) + '%';
      drawRoomVisual(roomId, torch);
    }

    function runCmd(cmd) {
      appendLog('> ' + cmd);
      const reply = Module.ccall('run_command', 'string', ['string'], [cmd]);
      appendLog(reply);
      syncHud();
    }

    function submitInput() {
      const input = document.getElementById('cmdInput');
      if (!input.value.trim()) return;
      runCmd(input.value.trim());
      input.value = '';
    }

    Module.onRuntimeInitialized = () => {
      appendLog('=== MULTI-ROOM OOP DUNGEON ESCAPE ===\nType a command or click an action button to begin (try: take, north).');
      syncHud();
    };
  </script>
</body>
</html>
