<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Idol Sprint — C++ OOP Temple Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-0: #06090d;
      --bg-1: #0c131a;
      --bg-2: #121c26;
      --bg-3: #192633;
      --line: rgba(148, 163, 184, 0.16);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --amber: #f59e0b;
      --cyan: #22d3ee;
      --crimson: #ef4444;
      --emerald: #10b981;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 0%, rgba(245, 158, 11, 0.13), transparent 45%),
        radial-gradient(ellipse at 85% 5%, rgba(16, 185, 129, 0.11), transparent 45%),
        var(--bg-0);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
    }
    .screen {
      width: 100vw;
      height: 100vh;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    header {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: 11px;
    }
    .head-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      min-width: 0;
    }
    h1 {
      margin: 0;
      font-family: 'Cinzel', serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.7px;
      background: linear-gradient(90deg, #fde68a, #f59e0b, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }
    .tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fde68a;
      white-space: nowrap;
    }
    .hud-bars {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stat-meter {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
    }
    .bar-bg {
      width: 92px;
      height: 7px;
      background: #05070a;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-hp { height: 100%; width: 100%; background: linear-gradient(90deg, #ef4444, #f59e0b 55%, #10b981); transition: width 0.2s; }
    .bar-stm { height: 100%; width: 100%; background: linear-gradient(90deg, #0284c7, #22d3ee); transition: width 0.2s; }
    .bar-foe { height: 100%; width: 100%; background: linear-gradient(90deg, #ea580c, #ef4444); transition: width 0.2s; }

    .main-area {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 1.58fr 0.96fr;
      gap: 9px;
    }
    .stage-col {
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .canvas-wrap {
      flex: 1 1 auto;
      min-height: 0;
      background: #05080d;
      border: 1px solid var(--line);
      border-radius: 11px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #gameCanvas {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      display: block;
    }
    .goal-line {
      flex: 0 0 auto;
      padding: 5px 12px;
      background: var(--bg-2);
      border-top: 1px solid var(--line);
      font-size: 11.5px;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .goal-line strong { color: var(--amber); margin-right: 6px; }

    .log-box {
      flex: 0 0 132px;
      background: #06090f;
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 7px 12px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.38;
      white-space: pre-wrap;
      color: #e2e8f0;
    }

    .side-panel {
      min-height: 0;
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }
    .sec-hd {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .avatar-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }
    .tab-btn {
      padding: 5px 6px;
      border-radius: 7px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .tab-btn.active {
      border-color: rgba(34, 211, 238, 0.7);
      background: rgba(34, 211, 238, 0.14);
      color: #a5f3fc;
    }
    .lore-scroll {
      font-size: 10.5px;
      color: #cbd5e1;
      line-height: 1.36;
      padding: 6px 8px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(148, 163, 184, 0.12);
      max-height: 82px;
      overflow-y: auto;
    }
    .relics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .rel-pill {
      padding: 4px;
      border-radius: 6px;
      text-align: center;
      font-size: 10.5px;
      font-weight: 600;
      background: var(--bg-2);
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .rel-pill.got {
      color: #fde68a;
      border-color: rgba(245, 158, 11, 0.55);
      background: rgba(245, 158, 11, 0.15);
    }
    .chambers-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      font-size: 10px;
    }
    .ch-cell {
      padding: 3px 5px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.02);
      color: var(--muted);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ch-cell.here {
      background: rgba(16, 185, 129, 0.2);
      color: #a7f3d0;
      font-weight: 700;
    }

    .dock {
      flex: 0 0 auto;
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 7px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .riddle-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 4px 9px;
      border-radius: 7px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.45);
      font-size: 11px;
      color: #fde68a;
    }
    .riddle-bar.open { display: flex; }
    .riddle-bar input {
      flex: 1;
      max-width: 220px;
      background: #05070b;
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: var(--text);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11.5px;
      outline: none;
    }
    .btn-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }
    button.m {
      background: var(--bg-2);
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.24);
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    button.m:hover { background: var(--bg-3); }
    button.m.atk { background: rgba(239, 68, 68, 0.16); border-color: rgba(239, 68, 68, 0.5); color: #fecaca; }
    button.m.skl { background: rgba(34, 211, 238, 0.15); border-color: rgba(34, 211, 238, 0.48); color: #a5f3fc; }
    button.m.gld { background: rgba(245, 158, 11, 0.18); border-color: rgba(245, 158, 11, 0.52); color: #fde68a; }
    button.m.grn { background: rgba(16, 185, 129, 0.16); border-color: rgba(16, 185, 129, 0.48); color: #a7f3d0; }

    .cli {
      flex: 1 1 150px;
      display: flex;
      align-items: center;
      background: #05070b;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 8px;
    }
    .cli span { color: var(--amber); font-family: monospace; font-weight: 700; margin-right: 5px; }
    .cli input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 4px 2px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <div class="head-left">
        <h1>IDOL SPRINT</h1>
        <span class="tag" id="roomTag">1. Idol Courtyard</span>
        <span class="tag" id="runTag" style="background:rgba(34,211,238,0.12);border-color:rgba(34,211,238,0.35);color:#a5f3fc;">Kaelen · Lv.1</span>
        <span class="tag" id="lossTag" style="background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.35);color:#fca5a5;">Knockdowns: 0</span>
      </div>
      <div class="hud-bars">
        <div class="stat-meter">
          <span>HP <span id="hpTxt">130</span>/<span id="maxHpTxt">130</span></span>
          <div class="bar-bg"><div class="bar-hp" id="hpBar"></div></div>
        </div>
        <div class="stat-meter">
          <span>STM <span id="stmTxt">100</span></span>
          <div class="bar-bg"><div class="bar-stm" id="stmBar"></div></div>
        </div>
        <div class="stat-meter" id="foeBarWrap" style="display:none;">
          <span style="color:#fca5a5;"><span id="foeNameTxt">Monkey</span> <span id="foeHpTxt">0</span></span>
          <div class="bar-bg"><div class="bar-foe" id="foeBar"></div></div>
        </div>
      </div>
    </header>

    <div class="main-area">
      <div class="stage-col">
        <div class="canvas-wrap">
          <canvas id="gameCanvas" width="780" height="320"></canvas>
          <div class="goal-line"><strong>OBJECTIVE</strong><span id="goalTxt">Starting temple run...</span></div>
        </div>
        <div class="log-box" id="combatLog"></div>
      </div>

      <aside class="side-panel">
        <div>
          <div class="sec-hd">Select Runner &amp; Backstory</div>
          <div class="avatar-tabs">
            <button class="tab-btn active" id="tab1" onclick="selectRunner(1)">Kaelen</button>
            <button class="tab-btn" id="tab2" onclick="selectRunner(2)">Lyra</button>
            <button class="tab-btn" id="tab3" onclick="selectRunner(3)">Thorne</button>
          </div>
          <div class="lore-scroll" id="runnerLore" style="margin-top:5px;"></div>
          <div style="display:flex;gap:5px;margin-top:5px;">
            <button class="m gld" style="flex:1;" onclick="newRun(1)">Run Lv.1 Standard</button>
            <button class="m atk" style="flex:1;" onclick="newRun(2)">Run Lv.2 Veteran</button>
          </div>
        </div>

        <div>
          <div class="sec-hd">Temple Relics</div>
          <div class="relics-grid">
            <div class="rel-pill" id="relTorch">Torch</div>
            <div class="rel-pill" id="relBlade">Blade</div>
            <div class="rel-pill" id="relHerb">Herb</div>
            <div class="rel-pill" id="relKey">Key</div>
          </div>
        </div>

        <div>
          <div class="sec-hd">6 Temple Chambers</div>
          <div class="chambers-grid">
            <div class="ch-cell here" id="ch1">1. Courtyard</div>
            <div class="ch-cell" id="ch2">2. Gallery</div>
            <div class="ch-cell" id="ch3">3. Cistern</div>
            <div class="ch-cell" id="ch4">4. Forge</div>
            <div class="ch-cell" id="ch5">5. Sanctum</div>
            <div class="ch-cell" id="ch6">6. Gate</div>
          </div>
        </div>
      </aside>
    </div>

    <div class="dock">
      <div class="riddle-bar" id="riddleBar">
        <span id="riddlePrompt">Challenge active:</span>
        <input id="riddleAns" type="text" placeholder="Type move or riddle answer..." />
        <button class="m gld" onclick="submitRiddle()">Submit</button>
      </div>

      <div class="btn-strip">
        <button class="m atk" onclick="runAction('slash')">Slash</button>
        <button class="m skl" onclick="runAction('vault')">Vault (-25 STM)</button>
        <button class="m skl" onclick="runAction('guard')">Guard &amp; Riposte</button>
        <button class="m gld" onclick="runAction('torch')">Torch Flare (-20 STM)</button>
        <button class="m grn" onclick="runAction('rest')">Rest (+STM)</button>
        <button class="m" onclick="runAction('take')">Take</button>
        <button class="m" onclick="runAction('search')">Inspect / Riddle</button>
        <button class="m" onclick="runAction('use herb')">Use Herb</button>
        <button class="m" onclick="runAction('door')">Gate</button>
        <button class="m" onclick="runAction('north')">North</button>
        <button class="m" onclick="runAction('south')">South</button>
        <form class="cli" onsubmit="event.preventDefault(); submitCli();">
          <span>&gt;</span>
          <input id="cliInput" type="text" placeholder="slash, vault, guard, torch, rest, take, search, north..." autocomplete="off" />
        </form>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const combatLog = document.getElementById('combatLog');
    let wasmReady = false;
    let chosenRunner = 1;
    let chosenDiff = 1;
    let animPhase = 0;
    let scrollOffset = 0;
    let runTimerFrames = 0;
    let encounterRevealFrames = 0;

    let cachedState = {
      roomId: 'cell',
      hp: 130,
      maxHp: 130,
      stm: 100,
      maxStm: 100,
      hasTorch: false,
      hasBlade: false,
      hasHerb: false,
      hasKey: false,
      foeHp: 0,
      foeMaxHp: 0,
      foeName: '',
      mode: '',
      anim: 'idle',
      avId: 1,
      defeats: 0
    };

    const runnerProfiles = {
      1: {
        name: 'Kaelen',
        bio: 'Kaelen grew up on the cliff paths overlooking the sunken jungle temple where his older brother vanished chasing a stolen sun-idol. Trained in ruined watchtowers, Kaelen reads crumbling stonework and demon monkey pack calls by instinct—balanced enough to endure long sprints, traps, and riddles without burning out too soon.'
      },
      2: {
        name: 'Lyra',
        bio: 'Lyra was a sky-bridge courier hired by rival expedition guilds before the temple’s ancient wards sealed the valley. Fast, daring, and deadly with a tempered blade, she vaults over hazards and punishes demon monkeys with heavy bursts, though her lighter armor leaves little room for sloppy mistakes.'
      },
      3: {
        name: 'Thorne',
        bio: 'Thorne spent twelve winters guarding a storm-battered monastery at the edge of the basin, learning to absorb punishing blows and steady his breathing under pressure. His strikes start measured, but his towering stamina and resilience let him outlast brutal demon monkey ambushes and recover from setbacks.'
      }
    };

    const chamberMap = {
      cell:     { label: '1. Idol Courtyard',    goal: 'Grab the Torch, then run North into the Trapped Gallery.', idx: 1 },
      corridor: { label: '2. Trapped Gallery',   goal: 'Battle the Crimson Demon Monkey (slash/vault/guard/torch), grab Blade, inspect traps for Key.', idx: 2 },
      cistern:  { label: '3. Sunken Cistern',    goal: 'Battle the Fang Demon Monkey & inspect the gong shrine for Riddle I.', idx: 3 },
      forge:    { label: '4. Obsidian Forge',    goal: 'Battle the Ember Demon Monkey, grab Herb, inspect anvil for Riddle III.', idx: 4 },
      sanctum:  { label: '5. Ember Sanctum',     goal: 'Inspect braziers (Riddle II), grab Herb, defeat the Alpha Idol Monkey.', idx: 5 },
      gate:     { label: '6. Outer Temple Gate', goal: 'Unlock with Key & solve Riddle IV to escape the temple.', idx: 6 }
    };

    function selectRunner(id) {
      chosenRunner = id;
      for (let i = 1; i <= 3; i++) {
        document.getElementById('tab' + i).classList.toggle('active', i === id);
      }
      document.getElementById('runnerLore').innerHTML =
        '<strong>' + runnerProfiles[id].name + ':</strong> ' + runnerProfiles[id].bio;
    }

    function appendCombat(msg) {
      combatLog.textContent += msg + '\n';
      combatLog.scrollTop = combatLog.scrollHeight;
    }

    function newRun(lv) {
      chosenDiff = lv;
      if (!wasmReady) return;
      const rName = runnerProfiles[chosenRunner].name.toLowerCase();
      const dWord = lv === 2 ? 'veteran' : 'standard';
      const reply = Module.ccall('run_command', 'string', ['string'], [`start ${rName} ${dWord}`]);
      combatLog.textContent = '';
      appendCombat(reply);
      runTimerFrames = 0;
      encounterRevealFrames = 0;
      animPhase = 10;
      syncState();
    }

    function drawHumanoidRunner(px, py, avId, hasTorch, hasBlade, isRunning, isGuarding, isSlashing, isVaulting, dirSign, phase) {
      ctx.save();
      ctx.translate(px, py);
      ctx.scale(dirSign, 1);

      const stride = isRunning ? Math.sin(phase) : 0;
      const counterStride = isRunning ? Math.sin(phase + Math.PI) : 0;
      const liftFront = isRunning ? Math.max(0, -Math.cos(phase)) * 8 : 0;
      const liftBack = isRunning ? Math.max(0, -Math.cos(phase + Math.PI)) * 8 : 0;

      // Distinct humanoid proportions & silhouettes per runner
      const torsoColor = avId === 1 ? '#3b4d61' : (avId === 2 ? '#1e3a5f' : '#4a3f35');
      const accentColor = avId === 1 ? '#f59e0b' : (avId === 2 ? '#22d3ee' : '#10b981');
      const skinColor = avId === 1 ? '#e2a679' : (avId === 2 ? '#f1c29b' : '#c88d63');

      // Back arm & back leg (humanoid limbs with joints)
      ctx.strokeStyle = skinColor;
      ctx.lineWidth = avId === 3 ? 8 : 6;
      ctx.lineCap = 'round';

      // Back leg
      const bxFootX = -counterStride * 16;
      const bxFootY = -liftBack;
      ctx.beginPath();
      ctx.moveTo(-2, -26);
      ctx.lineTo(bxFootX * 0.5, -13 - liftBack * 0.5);
      ctx.lineTo(bxFootX, bxFootY);
      ctx.stroke();

      // Back arm
      ctx.beginPath();
      ctx.moveTo(-2, -52);
      ctx.lineTo(stride * 12, -35);
      ctx.stroke();

      // Flowing mantle / scarf (only waves while running or vaulting)
      const waveAmp = (isRunning || isVaulting) ? Math.sin(phase * 1.4) * 5 : 1;
      ctx.fillStyle = accentColor;
      ctx.beginPath();
      ctx.moveTo(-4, -55);
      ctx.lineTo(-28, -36 + waveAmp);
      ctx.lineTo(-22, -22 + waveAmp);
      ctx.lineTo(-2, -32);
      ctx.closePath();
      ctx.fill();

      // Humanoid torso (broad chest for Thorne, sleek athletic for Lyra, balanced for Kaelen)
      const chestHalfW = avId === 3 ? 15 : (avId === 2 ? 10 : 12);
      ctx.fillStyle = torsoColor;
      ctx.beginPath();
      ctx.roundRect(-chestHalfW, -57, chestHalfW * 2, 32, 7);
      ctx.fill();

      // Belt & sash
      ctx.fillStyle = accentColor;
      ctx.fillRect(-chestHalfW, -29, chestHalfW * 2, 5);

      // Front leg
      const fxFootX = stride * 16;
      const fxFootY = -liftFront;
      ctx.strokeStyle = skinColor;
      ctx.lineWidth = avId === 3 ? 8 : 6;
      ctx.beginPath();
      ctx.moveTo(2, -26);
      ctx.lineTo(fxFootX * 0.5, -13 - liftFront * 0.5);
      ctx.lineTo(fxFootX, fxFootY);
      ctx.stroke();

      // Boots
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(fxFootX - 3, fxFootY - 5, 11, 5);
      ctx.fillRect(bxFootX - 3, bxFootY - 5, 11, 5);

      // Humanoid head + neck + distinct headgear/hair
      ctx.fillStyle = skinColor;
      ctx.fillRect(-4, -63, 8, 7);
      ctx.beginPath();
      ctx.arc(0, -72, 10.5, 0, Math.PI * 2);
      ctx.fill();

      // Eye & brow
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(4, -74, 3, 3);

      if (avId === 1) {
        // Kaelen: Ranger hood + headband
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(-1, -73, 12, Math.PI * 0.85, Math.PI * 1.95); ctx.stroke();
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(-10, -77, 21, 3.5);
      } else if (avId === 2) {
        // Lyra: Flowing cyan ponytail & sleek circlet
        ctx.fillStyle = '#22d3ee';
        ctx.beginPath();
        ctx.moveTo(-9, -76);
        ctx.quadraticCurveTo(-24, -72 + waveAmp, -28, -56 + waveAmp);
        ctx.lineTo(-14, -62 + waveAmp);
        ctx.closePath();
        ctx.fill();
      } else {
        // Thorne: Heavy horned/crested guardian helm & beard
        ctx.fillStyle = '#64748b';
        ctx.beginPath(); ctx.arc(0, -74, 12.5, Math.PI, 0); ctx.fill();
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, -86); ctx.lineTo(0, -94); ctx.stroke();
        ctx.fillStyle = '#475569';
        ctx.beginPath(); ctx.arc(3, -67, 7, 0, Math.PI * 0.9); ctx.fill();
      }

      // Front arm + weapon/torch
      ctx.strokeStyle = skinColor;
      ctx.lineWidth = avId === 3 ? 8 : 6;
      const armReachX = isSlashing ? 28 : 13;
      const armReachY = isSlashing ? -48 : -40 - counterStride * 8;
      ctx.beginPath();
      ctx.moveTo(4, -52);
      ctx.lineTo(armReachX, armReachY);
      ctx.stroke();

      if (hasBlade) {
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = isSlashing ? 5 : 3;
        ctx.beginPath();
        ctx.moveTo(armReachX, armReachY);
        ctx.lineTo(armReachX + (isSlashing ? 28 : 16), armReachY - (isSlashing ? 10 : 24));
        ctx.stroke();
      }

      if (hasTorch) {
        ctx.strokeStyle = '#92400e';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(armReachX, armReachY);
        ctx.lineTo(armReachX + 12, armReachY - 18);
        ctx.stroke();

        const flameGrad = ctx.createRadialGradient(armReachX + 12, armReachY - 22, 2, armReachX + 12, armReachY - 22, 26);
        flameGrad.addColorStop(0, '#fef08a');
        flameGrad.addColorStop(0.5, 'rgba(245, 158, 11, 0.75)');
        flameGrad.addColorStop(1, 'rgba(245, 158, 11, 0)');
        ctx.fillStyle = flameGrad;
        ctx.beginPath(); ctx.arc(armReachX + 12, armReachY - 22, 26, 0, Math.PI * 2); ctx.fill();
      }

      if (isGuarding) {
        ctx.strokeStyle = '#22d3ee';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(14, -42, 28, -0.85, 0.85); ctx.stroke();
      }

      ctx.restore();
    }

    function drawHumanoidDemonMonkey(ex, ey, foeName, foeHp, foeMaxHp, isRunning, recoilX, phase) {
      ctx.save();
      ctx.translate(ex + recoilX, ey);

      const stride = isRunning ? Math.sin(phase) : Math.sin(phase * 0.4) * 0.25;
      const bob = isRunning ? Math.abs(Math.cos(phase)) * 6 : Math.abs(Math.sin(phase * 0.5)) * 2;
      ctx.translate(0, -bob);

      // Curled demon tail
      ctx.strokeStyle = '#7c2d12';
      ctx.lineWidth = 4.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(16, -24);
      ctx.bezierCurveTo(44, -36 + stride * 8, 42, -76, 20, -72);
      ctx.stroke();

      // Hind legs
      ctx.strokeStyle = '#9a3412';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(-4, -22);
      ctx.lineTo(-12 - stride * 12, -8);
      ctx.lineTo(-10 - stride * 14, 0);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(6, -22);
      ctx.lineTo(10 + stride * 12, -8);
      ctx.lineTo(8 + stride * 14, 0);
      ctx.stroke();

      // Hunched humanoid-ape torso
      ctx.fillStyle = '#7c2d12';
      ctx.beginPath();
      ctx.ellipse(0, -38, 18, 22, 0.22, 0, Math.PI * 2);
      ctx.fill();

      // Chest markings
      ctx.fillStyle = '#ea580c';
      ctx.beginPath();
      ctx.ellipse(-4, -36, 9, 12, 0.15, 0, Math.PI * 2);
      ctx.fill();

      // Long front arm with claws
      ctx.strokeStyle = '#9a3412';
      ctx.lineWidth = 6.5;
      ctx.beginPath();
      ctx.moveTo(-10, -48);
      ctx.lineTo(-26, -30 + stride * 9);
      ctx.lineTo(-34, -14 + stride * 12);
      ctx.stroke();

      // Demon head + horns + glowing eyes
      ctx.fillStyle = '#991b1b';
      ctx.beginPath();
      ctx.arc(-6, -66, 14, 0, Math.PI * 2);
      ctx.fill();

      // Horns
      ctx.strokeStyle = '#fde047';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-13, -76); ctx.lineTo(-20, -90);
      ctx.moveTo(1, -76); ctx.lineTo(8, -90);
      ctx.stroke();

      // Eyes & snout
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(-15, -69, 4.5, 4);
      ctx.fillRect(-6, -69, 4.5, 4);

      ctx.restore();

      ctx.fillStyle = '#fca5a5';
      ctx.font = 'bold 11.5px Inter, sans-serif';
      ctx.fillText(`${foeName} (${foeHp}/${foeMaxHp})`, ex + recoilX - 65, ey + 18);
    }

    function drawObstacleHazard(ox, floorY, roomId, mode, scroll) {
      ctx.save();
      ctx.translate(ox, floorY);

      if (roomId === 'cistern') {
        // Sunken gong shrine / rising stepping stones
        ctx.fillStyle = '#0e7490';
        ctx.fillRect(-26, -10, 52, 10);
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(0, -34, 16, 0, Math.PI * 2); ctx.stroke();
      } else if (roomId === 'forge') {
        // Obsidian anvil & glowing runes
        ctx.fillStyle = '#334155';
        ctx.beginPath();
        ctx.moveTo(-24, -18); ctx.lineTo(24, -18); ctx.lineTo(14, -8); ctx.lineTo(-14, -8);
        ctx.closePath(); ctx.fill();
        ctx.fillRect(-8, -8, 16, 8);
      } else if (roomId === 'sanctum') {
        // Twin flame brazier
        ctx.fillStyle = '#475569';
        ctx.fillRect(-14, -22, 28, 22);
        const flicker = Math.sin(scroll * 0.25) * 4;
        ctx.fillStyle = '#f97316';
        ctx.beginPath(); ctx.arc(0, -28 + flicker * 0.4, 10, 0, Math.PI * 2); ctx.fill();
      } else {
        // Spike & dart hazard in corridor/gate
        ctx.fillStyle = '#cbd5e1';
        for (let i = -20; i <= 20; i += 13) {
          ctx.beginPath();
          ctx.moveTo(i - 5, 0);
          ctx.lineTo(i, -16);
          ctx.lineTo(i + 5, 0);
          ctx.closePath();
          ctx.fill();
        }
      }

      if (mode) {
        ctx.fillStyle = '#fde68a';
        ctx.font = 'bold 10.5px Inter, sans-serif';
        ctx.fillText('OBSTACLE AHEAD', -42, -56);
      }

      ctx.restore();
    }

    function drawTempleBattle(st) {
      const w = canvas.width, h = canvas.height;
      const { roomId, avId, hasTorch, hasBlade, foeHp, foeMaxHp, foeName, mode, anim } = st;
      ctx.clearRect(0, 0, w, h);

      // Character only runs when north or south is clicked (active runTimerFrames > 0)
      const isRunning = runTimerFrames > 0;
      const dirSign = (anim === 'run_south') ? -1 : 1;
      const trackSpeed = isRunning ? (anim === 'run_south' ? -2.8 : 2.8) : 0;
      scrollOffset += trackSpeed;

      if (isRunning) {
        runTimerFrames--;
        if (runTimerFrames === 0 && (foeHp > 0 || mode !== '')) {
          encounterRevealFrames = 16;
        }
      }
      if (encounterRevealFrames > 0) {
        encounterRevealFrames--;
      }

      // Temple jungle-stone atmosphere
      const bg = ctx.createLinearGradient(0, 0, 0, h);
      if (roomId === 'cistern') {
        bg.addColorStop(0, '#061c26');
        bg.addColorStop(1, '#0e2536');
      } else if (roomId === 'forge') {
        bg.addColorStop(0, '#29120a');
        bg.addColorStop(1, '#14111c');
      } else if (roomId === 'sanctum') {
        bg.addColorStop(0, '#2a0d19');
        bg.addColorStop(1, '#111524');
      } else if (roomId === 'gate') {
        bg.addColorStop(0, '#0a2942');
        bg.addColorStop(1, '#131b2e');
      } else {
        bg.addColorStop(0, '#08131a');
        bg.addColorStop(1, '#11212b');
      }
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      // Scrolling pillars & hanging vines (move only while running north/south)
      const colSpan = 220;
      const colStart = -(((scrollOffset * 0.7) % colSpan + colSpan) % colSpan) - 40;
      ctx.strokeStyle = 'rgba(167, 243, 208, 0.14)';
      ctx.lineWidth = 2;
      for (let cx = colStart; cx < w + colSpan; cx += colSpan) {
        ctx.strokeRect(cx - 22, 38, 44, 200);
        ctx.beginPath(); ctx.arc(cx, 38, 22, Math.PI, 0); ctx.stroke();
      }

      const vineSpan = 175;
      const vineStart = -(((scrollOffset * 1.1) % vineSpan + vineSpan) % vineSpan);
      ctx.strokeStyle = 'rgba(16, 185, 129, 0.28)';
      for (let vx = vineStart; vx < w + vineSpan; vx += vineSpan) {
        ctx.beginPath();
        ctx.moveTo(vx, 0);
        ctx.quadraticCurveTo(vx + 8, 26, vx - 3, 54);
        ctx.stroke();
      }

      // Temple floor track & flagstones
      const floorY = 238;
      ctx.fillStyle = roomId === 'cistern' ? '#0b2c3d' : '#15222e';
      ctx.fillRect(0, floorY, w, h - floorY);
      ctx.strokeStyle = 'rgba(245, 158, 11, 0.34)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(w, floorY); ctx.stroke();

      const tileSpan = 72;
      const tileStart = -(((scrollOffset * 2.4) % tileSpan + tileSpan) % tileSpan);
      ctx.strokeStyle = 'rgba(245, 158, 11, 0.18)';
      ctx.lineWidth = 1.5;
      for (let tx = tileStart; tx < w + tileSpan; tx += tileSpan) {
        ctx.beginPath();
        ctx.moveTo(tx, floorY);
        ctx.lineTo(tx - 24, h);
        ctx.stroke();
      }

      if (roomId === 'gate') {
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(345, 76, 90, floorY - 76);
      }

      const active = animPhase > 0;
      const isSlashing = active && anim === 'slash';
      const isGuarding = active && anim === 'guard';
      const isVaulting = active && anim === 'vault';
      const isTorching = active && anim === 'torch';

      const lungeX = (active && (isSlashing || isVaulting || isTorching)) ? 120 : 0;
      const vaultY = (active && isVaulting) ? -42 : (active && anim === 'defeat' ? 12 : 0);
      const foeRecoilX = (active && (isSlashing || isVaulting || isTorching || isGuarding)) ? 34 : 0;

      // Runner enters from left during north/south run, then holds position in chamber
      const runProgress = isRunning ? (1 - runTimerFrames / 95) : 1;
      const basePx = isRunning ? (-40 + runProgress * 215) : 175;
      const px = basePx + lungeX;
      const py = floorY + vaultY;

      drawHumanoidRunner(
        px, py, avId, hasTorch, hasBlade,
        isRunning, isGuarding, isSlashing, isVaulting,
        dirSign, scrollOffset * 0.16
      );

      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 11.5px Inter, sans-serif';
      ctx.fillText(runnerProfiles[avId].name.toUpperCase(), px - 22, floorY + 18);

      // Obstacles & Demon Monkeys appear after the run finishes
      if (!isRunning) {
        if (mode !== '' || roomId === 'corridor' || roomId === 'cistern' || roomId === 'forge' || roomId === 'sanctum') {
          drawObstacleHazard(435, floorY, roomId, mode, scrollOffset);
        }
        if (foeHp > 0) {
          drawHumanoidDemonMonkey(585, floorY, foeName, foeHp, foeMaxHp, false, foeRecoilX, scrollOffset * 0.12);
        }
      } else {
        ctx.fillStyle = '#34d399';
        ctx.font = 'bold 12px Inter, sans-serif';
        ctx.fillText(anim === 'run_south' ? 'RUNNING SOUTH...' : 'RUNNING NORTH...', 320, 34);
      }

      if (encounterRevealFrames > 0 && !isRunning) {
        ctx.fillStyle = '#fca5a5';
        ctx.font = 'bold 12px Inter, sans-serif';
        ctx.fillText('ENCOUNTER REACHED!', 320, 54);
      }

      if (active && !isRunning) {
        ctx.fillStyle = anim === 'defeat' ? '#ef4444' : '#fde68a';
        ctx.font = 'bold 13px Inter, sans-serif';
        const banner = {
          slash: 'SLASH STRIKE!',
          vault: 'VAULT SLAM!',
          guard: 'GUARD RIPOSTE!',
          torch: 'TORCH FLARE!',
          defeat: 'KNOCKED DOWN — REGROUPING AT COURTYARD!',
          escape: 'TEMPLE ESCAPED!'
        }[anim] || '';
        if (banner) ctx.fillText(banner, 315, 36);
        animPhase--;
      }
    }

    function syncRiddleBar(mode) {
      const bar = document.getElementById('riddleBar');
      const txt = document.getElementById('riddlePrompt');
      const inp = document.getElementById('riddleAns');
      const prompts = {
        trap:         'Run Hazard active — type move (slide, leap, brace):',
        crevice:      'Carved Niche active — type side (left or right):',
        riddle_bell:  'Riddle I active — type your answer:',
        riddle_forge: 'Riddle III active — type your answer:',
        brazier:      'Riddle II active — type your answer:',
        riddle_gate:  'Riddle IV active — type your answer:'
      };
      if (prompts[mode]) {
        bar.classList.add('open');
        txt.textContent = prompts[mode];
        inp.focus();
      } else {
        bar.classList.remove('open');
        inp.value = '';
      }
    }

    function syncState() {
      const roomId = Module.ccall('current_room', 'string', [], []);
      const hp = Module.ccall('current_hp', 'number', [], []);
      const maxHp = Module.ccall('max_hp', 'number', [], []);
      const stm = Module.ccall('current_stamina', 'number', [], []);
      const maxStm = Module.ccall('max_stamina', 'number', [], []);
      const hasTorch = Module.ccall('has_torch_flag', 'number', [], []) === 1;
      const hasBlade = Module.ccall('has_blade_flag', 'number', [], []) === 1;
      const hasHerb = Module.ccall('has_herb_flag', 'number', [], []) === 1;
      const hasKey = Module.ccall('has_key_flag', 'number', [], []) === 1;
      const foeHp = Module.ccall('enemy_hp', 'number', [], []);
      const foeMaxHp = Module.ccall('enemy_max_hp', 'number', [], []);
      const foeName = Module.ccall('enemy_name', 'string', [], []);
      const mode = Module.ccall('prompt_mode', 'string', [], []);
      const anim = Module.ccall('last_anim', 'string', [], []);
      const avId = Module.ccall('current_avatar_id', 'number', [], []);
      const defeats = Module.ccall('defeats_count', 'number', [], []);

      cachedState = {
        roomId, hp, maxHp, stm, maxStm,
        hasTorch, hasBlade, hasHerb, hasKey,
        foeHp, foeMaxHp, foeName, mode, anim, avId, defeats
      };

      const cInfo = chamberMap[roomId] || { label: roomId, goal: '', idx: 1 };
      document.getElementById('roomTag').textContent = cInfo.label;
      document.getElementById('runTag').textContent = `${runnerProfiles[avId].name} · Lv.${chosenDiff}`;
      document.getElementById('lossTag').textContent = `Knockdowns: ${defeats}`;
      document.getElementById('goalTxt').textContent = cInfo.goal;

      document.getElementById('hpTxt').textContent = hp;
      document.getElementById('maxHpTxt').textContent = maxHp;
      document.getElementById('hpBar').style.width = Math.max(0, Math.min(100, (hp / maxHp) * 100)) + '%';

      document.getElementById('stmTxt').textContent = stm;
      document.getElementById('stmBar').style.width = Math.max(0, Math.min(100, (stm / maxStm) * 100)) + '%';

      const foeWrap = document.getElementById('foeBarWrap');
      if (foeHp > 0) {
        foeWrap.style.display = 'flex';
        document.getElementById('foeNameTxt').textContent = foeName;
        document.getElementById('foeHpTxt').textContent = `${foeHp}/${foeMaxHp}`;
        document.getElementById('foeBar').style.width = Math.max(0, Math.min(100, (foeHp / foeMaxHp) * 100)) + '%';
      } else {
        foeWrap.style.display = 'none';
      }

      document.getElementById('relTorch').classList.toggle('got', hasTorch);
      document.getElementById('relBlade').classList.toggle('got', hasBlade);
      document.getElementById('relHerb').classList.toggle('got', hasHerb);
      document.getElementById('relKey').classList.toggle('got', hasKey);

      for (let i = 1; i <= 6; i++) {
        document.getElementById('ch' + i).classList.toggle('here', i === cInfo.idx);
      }

      syncRiddleBar(mode);
      drawTempleBattle(cachedState);
    }

    function runAction(cmd) {
      if (!wasmReady) return;
      const prevRoom = Module.ccall('current_room', 'string', [], []);
      appendCombat('> ' + cmd);
      const out = Module.ccall('run_command', 'string', ['string'], [cmd]);
      appendCombat(out);
      const nextRoom = Module.ccall('current_room', 'string', [], []);
      const norm = cmd.trim().toLowerCase();
      if ((norm === 'north' || norm === 'south' || norm === 'retreat') && nextRoom !== prevRoom) {
        // ~2.3 seconds of running at 60fps before revealing demons & obstacles in the chamber
        runTimerFrames = 140;
      } else {
        animPhase = 14;
      }
      syncState();
    }

    function submitRiddle() {
      const inp = document.getElementById('riddleAns');
      const v = inp.value.trim();
      if (!v) return;
      runAction(v);
      inp.value = '';
    }

    function submitCli() {
      const inp = document.getElementById('cliInput');
      const v = inp.value.trim();
      if (!v) return;
      runAction(v);
      inp.value = '';
    }

    var Module = {
      onRuntimeInitialized: function () {
        wasmReady = true;
        selectRunner(1);
        newRun(1);
      }
    };

    function loopFrame() {
      drawTempleBattle(cachedState);
      requestAnimationFrame(loopFrame);
    }
    requestAnimationFrame(loopFrame);
  </script>
  <script src="dungeon.js"></script>
</body>
