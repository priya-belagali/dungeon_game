<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eclipse of the Relic — 3-Level C++ OOP Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-0: #05080d;
      --bg-1: #0b1219;
      --bg-2: #121c27;
      --bg-3: #192635;
      --line: rgba(148, 163, 184, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --amber: #f59e0b;
      --cyan: #22d3ee;
      --crimson: #ef4444;
      --emerald: #10b981;
      --violet: #a855f7;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 0%, rgba(245, 158, 11, 0.14), transparent 45%),
        radial-gradient(ellipse at 85% 5%, rgba(168, 85, 247, 0.12), transparent 45%),
        var(--bg-0);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
    }
    .screen {
      width: 100vw;
      height: 100vh;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    header {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: 11px;
    }
    .head-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      min-width: 0;
    }
    h1 {
      margin: 0;
      font-family: 'Cinzel', serif;
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: 0.7px;
      background: linear-gradient(90deg, #fde68a, #f59e0b, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }
    .tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fde68a;
      white-space: nowrap;
    }
    .tag.timer {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.55);
      color: #fca5a5;
    }
    .hud-bars {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stat-meter {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
    }
    .bar-bg {
      width: 88px;
      height: 7px;
      background: #05070a;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-hp { height: 100%; width: 100%; background: linear-gradient(90deg, #ef4444, #f59e0b 55%, #10b981); transition: width 0.2s; }
    .bar-stm { height: 100%; width: 100%; background: linear-gradient(90deg, #0284c7, #22d3ee); transition: width 0.2s; }
    .bar-foe { height: 100%; width: 100%; background: linear-gradient(90deg, #dc2626, #a855f7); transition: width 0.2s; }

    .main-area {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 1.62fr 0.94fr;
      gap: 9px;
    }
    .stage-col {
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .canvas-wrap {
      flex: 1 1 auto;
      min-height: 0;
      background: #05080d;
      border: 1px solid var(--line);
      border-radius: 11px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #gameCanvas {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      display: block;
    }
    .goal-line {
      flex: 0 0 auto;
      padding: 5px 12px;
      background: var(--bg-2);
      border-top: 1px solid var(--line);
      font-size: 11.5px;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .goal-line strong { color: var(--amber); margin-right: 6px; }

    .log-box {
      flex: 0 0 124px;
      background: #06090f;
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 7px 12px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.36;
      white-space: pre-wrap;
      color: #e2e8f0;
    }

    .side-panel {
      min-height: 0;
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }
    .sec-hd {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .avatar-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }
    .tab-btn {
      padding: 5px 6px;
      border-radius: 7px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .tab-btn.active {
      border-color: rgba(34, 211, 238, 0.7);
      background: rgba(34, 211, 238, 0.14);
      color: #a5f3fc;
    }
    .lore-scroll {
      font-size: 10.5px;
      color: #cbd5e1;
      line-height: 1.35;
      padding: 6px 8px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(148, 163, 184, 0.12);
      max-height: 76px;
      overflow-y: auto;
    }
    .relics-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }
    .rel-pill {
      padding: 4px 2px;
      border-radius: 6px;
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      background: var(--bg-2);
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .rel-pill.got {
      color: #fde68a;
      border-color: rgba(245, 158, 11, 0.55);
      background: rgba(245, 158, 11, 0.15);
    }
    .rel-pill.relic-special.got {
      color: #e9d5ff;
      border-color: rgba(168, 85, 247, 0.7);
      background: rgba(168, 85, 247, 0.22);
    }
    .chambers-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      font-size: 10px;
    }
    .ch-cell {
      padding: 3px 5px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.02);
      color: var(--muted);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ch-cell.here {
      background: rgba(16, 185, 129, 0.2);
      color: #a7f3d0;
      font-weight: 700;
    }

    .dock {
      flex: 0 0 auto;
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 7px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .riddle-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 4px 9px;
      border-radius: 7px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.45);
      font-size: 11px;
      color: #fde68a;
    }
    .riddle-bar.open { display: flex; }
    .riddle-bar input {
      flex: 1;
      max-width: 220px;
      background: #05070b;
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: var(--text);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11.5px;
      outline: none;
    }
    .btn-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }
    button.m {
      background: var(--bg-2);
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.24);
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    button.m:hover { background: var(--bg-3); }
    button.m.atk { background: rgba(239, 68, 68, 0.16); border-color: rgba(239, 68, 68, 0.5); color: #fecaca; }
    button.m.skl { background: rgba(34, 211, 238, 0.15); border-color: rgba(34, 211, 238, 0.48); color: #a5f3fc; }
    button.m.gld { background: rgba(245, 158, 11, 0.18); border-color: rgba(245, 158, 11, 0.52); color: #fde68a; }
    button.m.grn { background: rgba(16, 185, 129, 0.16); border-color: rgba(16, 185, 129, 0.48); color: #a7f3d0; }

    .cli {
      flex: 1 1 140px;
      display: flex;
      align-items: center;
      background: #05070b;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 8px;
    }
    .cli span { color: var(--amber); font-family: monospace; font-weight: 700; margin-right: 5px; }
    .cli input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 4px 2px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <div class="head-left">
        <h1>ECLIPSE OF THE RELIC</h1>
        <span class="tag" id="lvlTag">Level 1</span>
        <span class="tag" id="roomTag">1. Sunlit Courtyard</span>
        <span class="tag timer" id="timerTag" style="display:none;">Clock: 90s</span>
        <button class="m" id="sfxBtn" onclick="toggleSfx()">SFX: ON</button>
      </div>
      <div class="hud-bars">
        <div class="stat-meter">
          <span>HP <span id="hpTxt">140</span>/<span id="maxHpTxt">140</span></span>
          <div class="bar-bg"><div class="bar-hp" id="hpBar"></div></div>
        </div>
        <div class="stat-meter">
          <span>STM <span id="stmTxt">100</span></span>
          <div class="bar-bg"><div class="bar-stm" id="stmBar"></div></div>
        </div>
        <div class="stat-meter" id="foeBarWrap" style="display:none;">
          <span style="color:#f5d0fe;"><span id="foeNameTxt">Villain</span> <span id="foeHpTxt">0</span></span>
          <div class="bar-bg"><div class="bar-foe" id="foeBar"></div></div>
        </div>
      </div>
    </header>

    <div class="main-area">
      <div class="stage-col">
        <div class="canvas-wrap">
          <canvas id="gameCanvas" width="800" height="325"></canvas>
          <div class="goal-line"><strong>OBJECTIVE</strong><span id="goalTxt">Starting Level 1...</span></div>
        </div>
        <div class="log-box" id="combatLog"></div>
      </div>

      <aside class="side-panel">
        <div>
          <div class="sec-hd">Select Character &amp; Backstory</div>
          <div class="avatar-tabs">
            <button class="tab-btn active" id="tab1" onclick="selectRunner(1)">Kaelen</button>
            <button class="tab-btn" id="tab2" onclick="selectRunner(2)">Lyra</button>
            <button class="tab-btn" id="tab3" onclick="selectRunner(3)">Thorne</button>
          </div>
          <div class="lore-scroll" id="runnerLore" style="margin-top:5px;"></div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:5px;">
            <button class="m gld" onclick="newRun(1)">Lv.1 Ruins</button>
            <button class="m skl" onclick="newRun(2)">Lv.2 Relic Hunt</button>
            <button class="m atk" onclick="newRun(3)">Lv.3 Endgame</button>
          </div>
        </div>

        <div>
          <div class="sec-hd">Items &amp; Ancient Relic</div>
          <div class="relics-grid">
            <div class="rel-pill" id="relTorch">Torch</div>
            <div class="rel-pill" id="relBlade">Blade</div>
            <div class="rel-pill" id="relHerb">Herb</div>
            <div class="rel-pill" id="relKey">Key</div>
            <div class="rel-pill relic-special" id="relRelic">Relic</div>
          </div>
        </div>

        <div>
          <div class="sec-hd">6 Chambers</div>
          <div class="chambers-grid">
            <div class="ch-cell here" id="ch1">1. Start</div>
            <div class="ch-cell" id="ch2">2. Gallery</div>
            <div class="ch-cell" id="ch3">3. Cistern</div>
            <div class="ch-cell" id="ch4">4. Forge</div>
            <div class="ch-cell" id="ch5">5. Sanctum</div>
            <div class="ch-cell" id="ch6">6. Final Gate</div>
          </div>
        </div>
      </aside>
    </div>

    <div class="dock">
      <div class="riddle-bar" id="riddleBar">
        <span id="riddlePrompt">Challenge active:</span>
        <input id="riddleAns" type="text" placeholder="Type move or answer..." />
        <button class="m gld" onclick="submitRiddle()">Submit</button>
      </div>

      <div class="btn-strip">
        <button class="m atk" onclick="runAction('slash')">Slash</button>
        <button class="m skl" onclick="runAction('vault')">Vault (-25 STM)</button>
        <button class="m skl" onclick="runAction('guard')">Guard &amp; Riposte</button>
        <button class="m gld" onclick="runAction('torch')">Torch Flare (-20 STM)</button>
        <button class="m grn" onclick="runAction('rest')">Rest (+STM)</button>
        <button class="m" onclick="runAction('take')">Take</button>
        <button class="m" onclick="runAction('search')">Inspect / Riddle</button>
        <button class="m" onclick="runAction('use herb')">Use Herb</button>
        <button class="m" onclick="runAction('door')">Final Gate</button>
        <button class="m" onclick="runAction('north')">North</button>
        <button class="m" onclick="runAction('south')">South (-STM)</button>
        <button class="m" onclick="runAction('east')">East</button>
        <button class="m" onclick="runAction('west')">West</button>
        <form class="cli" onsubmit="event.preventDefault(); submitCli();">
          <span>&gt;</span>
          <input id="cliInput" type="text" placeholder="slash, vault, guard, torch, take, search, north..." autocomplete="off" />
        </form>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const combatLog = document.getElementById('combatLog');

    let wasmReady = false;
    let useFallback = false;
    let chosenRunner = 1;
    let scrollOffset = 0;
    let runTimerFrames = 0;
    let heroAttackFrames = 0;
    let enemyAttackFrames = 0;
    let heroHurtFrames = 0;
    let enemyHurtFrames = 0;
    let level3SecondsLeft = 90;
    let bubbleText = '';
    let bubbleTimer = 0;
    let sfxEnabled = true;
    let audioCtx = null;
    let shakeFrames = 0;
    let particles = [];
    let facingDir = 'east'; // 'east' | 'west' | 'north' | 'south'

    const runnerProfiles = {
      1: {
        name: 'Kaelen',
        bio: 'Raised in forgotten border shrines, Kaelen spent years mapping collapsed catacombs for fallen orders—convinced that ancient relics hold the key to rewriting an unjust fate.'
      },
      2: {
        name: 'Lyra',
        bio: 'Once a trusted cipher-runner for the temple archivists, Lyra fled after uncovering banned rites—now pursuing the Relic to settle an old score with those who cast her out.'
      },
      3: {
        name: 'Thorne',
        bio: 'A survivor of long-forgotten frontier wars, Thorne watched kingdoms rise and fracture on empty oaths—quietly building toward a reckoning meant to end the cycle forever.'
      }
    };

    // 9-room maze layout with grid coords (gx, gy) for canvas minimap:
    // West wing: west1 (-1, 0) -> west2 (-2, 0)
    // East wing: forge (+1, 0) -> east2 (+2, 0)
    // North wing: corridor (0, -1) -> sanctum (0, -2) -> gate (0, -3)
    // South wing: cistern (0, +1)
    const mazeRooms = {
      cell:     { title: '1. Maze Crossroads',   gx: 0,  gy: 0,  idx: 1, north: 'corridor', south: 'cistern', east: 'forge',   west: 'west1',  item: 'Torch', foe: { name: 'Demon Monkey', kind: 'monkey', hp: 62 } },
      west1:    { title: '2. West Armory Wing',   gx: -1, gy: 0,  idx: 2, north: null,       south: null,      east: 'cell',    west: 'west2',  item: 'Blade', foe: { name: 'Demon Monkey', kind: 'monkey', hp: 68 } },
      west2:    { title: '3. West Crypt (Dead End)', gx: -2, gy: 0, idx: 3, north: null,    south: null,      east: 'west1',   west: null,     item: 'Herb',  foe: { name: 'Shadow Wraith', kind: 'wraith', hp: 82 } },
      forge:    { title: '4. East Demon Foundry', gx: 1,  gy: 0,  idx: 4, north: null,       south: null,      east: 'east2',   west: 'cell',   item: 'Relic', foe: { name: 'Obsidian Golem', kind: 'golem', hp: 96 } },
      east2:    { title: '5. East Chasm (Trap)',  gx: 2,  gy: 0,  idx: 4, north: null,       south: null,      east: null,      west: 'forge',  item: null,    foe: null, lethal: true },
      corridor: { title: '6. North Gallery',      gx: 0,  gy: -1, idx: 2, north: 'sanctum',  south: 'cell',    east: 'forge',   west: 'west1',  item: null,    foe: { name: 'Demon Monkey', kind: 'monkey', hp: 70 } },
      sanctum:  { title: '7. North Sanctum',      gx: 0,  gy: -2, idx: 5, north: 'gate',     south: 'corridor',east: null,      west: null,     item: 'Key',   foe: { name: 'Obsidian Golem', kind: 'golem', hp: 98 } },
      cistern:  { title: '8. South Vault (-STM)', gx: 0,  gy: 1,  idx: 3, north: 'cell',     south: null,      east: 'forge',   west: 'west1',  item: 'Herb',  foe: { name: 'Shadow Wraith', kind: 'wraith', hp: 84 } },
      gate:     { title: '9. Final Gate',         gx: 0,  gy: -3, idx: 6, north: null,       south: 'sanctum', east: null,      west: null,     item: null,    foe: { name: 'Astral Warden', kind: 'seraph', hp: 118 } }
    };

    let fbState = {
      lvl: 1, room: 'cell', hp: 140, maxHp: 140, stm: 100, maxStm: 100,
      hasTorch: false, hasBlade: false, hasHerb: false, hasKey: false, hasRelic: false,
      foeHp: 0, foeMaxHp: 0, foeName: '', foeKind: '', anim: 'idle', destroyed: false, avId: 1
    };

    let cachedState = {
      roomId: 'cell', hp: 140, maxHp: 140, stm: 100, maxStm: 100,
      hasTorch: false, hasBlade: false, hasHerb: false, hasKey: false, hasRelic: false,
      foeHp: 0, foeMaxHp: 0, foeName: '', foeKind: '', mode: '', anim: 'idle',
      lvl: 1, destroyed: false, avId: 1, defeats: 0
    };

    function getAudio() {
      if (!sfxEnabled) return null;
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playSfx(type) {
      const ac = getAudio();
      if (!ac) return;
      const now = ac.currentTime;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.connect(gain);
      gain.connect(ac.destination);

      if (type === 'slash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.14);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
      } else if (type === 'vault') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(760, now + 0.18);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
        osc.start(now); osc.stop(now + 0.19);
      } else if (type === 'guard') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.setValueAtTime(510, now + 0.06);
        gain.gain.setValueAtTime(0.09, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.start(now); osc.stop(now + 0.16);
      } else if (type === 'torch') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.exponentialRampToValueAtTime(65, now + 0.28);
        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.29);
        osc.start(now); osc.stop(now + 0.29);
      } else if (type === 'move') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(175, now);
        osc.frequency.exponentialRampToValueAtTime(105, now + 0.11);
        gain.gain.setValueAtTime(0.11, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else if (type === 'dead_end') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(130, now + 0.22);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.23);
        osc.start(now); osc.stop(now + 0.23);
      } else if (type === 'death') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(42, now + 0.55);
        gain.gain.setValueAtTime(0.20, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.58);
        osc.start(now); osc.stop(now + 0.58);
      } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554, now + 0.1);
        osc.frequency.setValueAtTime(659, now + 0.2);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
        osc.start(now); osc.stop(now + 0.38);
      } else {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(380, now);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.start(now); osc.stop(now + 0.06);
      }
    }

    function toggleSfx() {
      sfxEnabled = !sfxEnabled;
      const btn = document.getElementById('sfxBtn');
      if (btn) btn.textContent = sfxEnabled ? 'SFX: ON' : 'SFX: OFF';
      if (sfxEnabled) playSfx('click');
    }

    function spawnBurst(x, y, color, count = 18) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1.2 + Math.random() * 4.2;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 1.2,
          life: 24 + Math.floor(Math.random() * 18),
          maxLife: 42,
          color,
          r: 2 + Math.random() * 3
        });
      }
    }

    function setBubble(text, frames = 150) {
      bubbleText = text;
      bubbleTimer = frames;
    }

    function appendCombat(msg) {

      mazeRooms.sanctum.item = 'Key';
      mazeRooms.sanctum.foe = { name: 'Obsidian Golem', kind: 'golem', hp: 88 + lv * 12 };
      mazeRooms.cistern.item = 'Herb';
      mazeRooms.cistern.foe = { name: 'Shadow Wraith', kind: 'wraith', hp: 76 + lv * 10 };

    function selectRunner(id) {
      fbState.avId = id;
      chosenRunner = id;
      for (let i = 1; i <= 3; i++) {
        document.getElementById('tab' + i).classList.toggle('active', i === id);
      }
      document.getElementById('runnerLore').innerHTML =
        '<strong>' + runnerProfiles[id].name + ':</strong> ' + runnerProfiles[id].bio;
      if (wasmReady && !useFallback) {
        const rName = runnerProfiles[chosenRunner].name.toLowerCase();
        Module.ccall('run_command', 'string', ['string'], [`start ${rName} level${cachedState.lvl || 1}`]);
        syncWasmState();
      } else {
        loadMazeLevel(fbState.lvl);
        pushFallbackState();
      }
    }

    function newRun(lvl) {
      runTimerFrames = 0;
      heroAttackFrames = 0;
      enemyAttackFrames = 0;
      heroHurtFrames = 0;
      enemyHurtFrames = 0;
      level3SecondsLeft = 90;
      if (wasmReady && !useFallback) {
        const rName = runnerProfiles[chosenRunner].name.toLowerCase();
        const reply = Module.ccall('run_command', 'string', ['string'], [`start ${rName} level${lvl}`]);
        combatLog.textContent = '';
        appendCombat(reply);
        syncWasmState();
      } else {
        loadMazeLevel(lvl);
        combatLog.textContent = `[Level ${lvl} Started — ${runnerProfiles[fbState.avId].name}]\nExits from Crossroads: [North] [South] [East] [West]. Try 'east' or 'west' to explore!\n`;
        setBubble(`Level ${lvl} ready! Explore East, West, North, or South.`);

    function pushFallbackState() {
      const r = mazeRooms[fbState.room] || mazeRooms.cell;
      const foe = r.foe && r.foe.hp > 0 ? r.foe : null;
      cachedState = {
        roomId: fbState.room,
        hp: fbState.hp,
        maxHp: fbState.maxHp,
        stm: fbState.stm,
        maxStm: fbState.maxStm,
        hasTorch: fbState.hasTorch,
        hasBlade: fbState.hasBlade,
        hasHerb: fbState.hasHerb,
        hasKey: fbState.hasKey,
        hasRelic: fbState.hasRelic,
        foeHp: foe ? foe.hp : 0,
        foeMaxHp: foe ? (70 + fbState.lvl * 14) : 0,
        foeName: foe ? foe.name : '',
        foeKind: foe ? foe.kind : '',
        mode: '',
        anim: fbState.anim,
        lvl: fbState.lvl,
        destroyed: fbState.destroyed,
        avId: fbState.avId,
        defeats: 0
      };
      renderHud(cachedState, r);
    }

    function syncWasmState() {
      const roomId = Module.ccall('current_room', 'string', [], []);
      const hp = Module.ccall('current_hp', 'number', [], []);
      const maxHp = Module.ccall('max_hp', 'number', [], []);
      const stm = Module.ccall('current_stamina', 'number', [], []);
      const maxStm = Module.ccall('max_stamina', 'number', [], []);
      const hasTorch = Module.ccall('has_torch_flag', 'number', [], []) === 1;
      const hasBlade = Module.ccall('has_blade_flag', 'number', [], []) === 1;
      const hasHerb = Module.ccall('has_herb_flag', 'number', [], []) === 1;
      const hasKey = Module.ccall('has_key_flag', 'number', [], []) === 1;
      const hasRelic = Module.ccall('has_relic_flag', 'number', [], []) === 1;
      const foeHp = Module.ccall('enemy_hp', 'number', [], []);
      const foeMaxHp = Module.ccall('enemy_max_hp', 'number', [], []);
      const foeName = Module.ccall('enemy_name', 'string', [], []);
      const foeKind = Module.ccall('enemy_kind', 'string', [], []);
      const mode = Module.ccall('prompt_mode', 'string', [], []);
      const anim = Module.ccall('last_anim', 'string', [], []);
      const lvl = Module.ccall('current_level', 'number', [], []);
      const destroyed = Module.ccall('is_world_destroyed', 'number', [], []) === 1;
      const avId = Module.ccall('current_avatar_id', 'number', [], []);
      const defeats = Module.ccall('defeats_count', 'number', [], []);

      cachedState = {
        roomId, hp, maxHp, stm, maxStm,
        hasTorch, hasBlade, hasHerb, hasKey, hasRelic,
        foeHp, foeMaxHp, foeName, foeKind, mode, anim, lvl, destroyed, avId, defeats
      };
      const r = mazeRooms[roomId] || { title: roomId, idx: 1 };
      renderHud(cachedState, r);
    }

    function renderHud(st, r) {

        timerEl.textContent = `Time Left: ${level3SecondsLeft}s`;
      } else {
        timerEl.style.display = 'none';
      }

      const objs = {
        1: 'Lv.1 Sunlit Ruins — Explore East/West/North/South wings, grab Torch/Blade/Relic/Key & unlock Gate.',
        2: 'Lv.2 Relic Hunt — Fight demons in East & West wings, claim Relic & Key, unlock Gate.',
        3: 'Lv.3 Eclipse Endgame — Beat the clock & maze; claim Scythe/Relic/Key & open Final Gate!'
      };

      document.getElementById('hpTxt').textContent = st.hp;
      document.getElementById('maxHpTxt').textContent = st.maxHp;

        document.getElementById('foeHpTxt').textContent = `${st.foeHp}/${st.foeMaxHp}`;
        document.getElementById('foeBar').style.width = Math.max(0, Math.min(100, (st.foeHp / st.foeMaxHp) * 100)) + '%';

      for (let i = 1; i <= 6; i++) {

    function runAction(cmd) {
      const c = cmd.trim().toLowerCase();
      if (!c) return;

      if (c === 'east') facingDir = 'east';
      else if (c === 'west') facingDir = 'west';
      else if (c === 'north') facingDir = 'north';
      else if (c === 'south' || c === 'retreat') facingDir = 'south';

      if (wasmReady && !useFallback) {
        const prevRoom = Module.ccall('current_room', 'string', [], []);
        const prevHp = Module.ccall('current_hp', 'number', [], []);
        const prevFoeHp = Module.ccall('enemy_hp', 'number', [], []);
        appendCombat('> ' + cmd);
        const out = Module.ccall('run_command', 'string', ['string'], [cmd]);
        appendCombat(out);
        const nextRoom = Module.ccall('current_room', 'string', [], []);
        const nextHp = Module.ccall('current_hp', 'number', [], []);
        const nextFoeHp = Module.ccall('enemy_hp', 'number', [], []);
        const anim = Module.ccall('last_anim', 'string', [], []);

        if ((c === 'north' || c === 'south' || c === 'east' || c === 'west' || c === 'retreat') && nextRoom !== prevRoom) {
          runTimerFrames = 110;
          const labels = {
            north: 'Exploring North...',
            south: 'Heading South (-STM)...',
            retreat: 'Retreating South...',
            east: 'Turning East into the wing...',
            west: 'Turning West into the wing...'
          };
          setBubble(labels[c] || 'Exploring...');
          playSfx('move');
        } else if (anim === 'slash' || anim === 'vault' || anim === 'guard' || anim === 'torch') {
          heroAttackFrames = 22;
          if (nextFoeHp < prevFoeHp) enemyHurtFrames = 22;
          if (nextHp < prevHp && nextFoeHp > 0) setTimeout(() => { enemyAttackFrames = 22; heroHurtFrames = 22; }, 220);
          playSfx(anim); shakeFrames = 9; spawnBurst(540, 195, '#fbbf24', 18);
        } else {
          playSfx('click');
        }
        syncWasmState();
        return;
      }

      // Standalone 9-room maze engine
      appendCombat('> ' + cmd);
      const r = mazeRooms[fbState.room] || mazeRooms.cell;

      const moveDir = (dir, cost, animName) => {
        if (dir === 'north' && r.foe && r.foe.hp > 0) {
          appendCombat(`[Blocked] ${r.foe.name} guards the northern path! Defeat it first or try East/West.`);
          playSfx('dead_end');
          return;
        }
        const nextId = r[dir];
        if (!nextId) {
          appendCombat(`[Wall] No exit ${dir} from ${r.title}.`);
          playSfx('dead_end');
          return;
        }
        fbState.room = nextId;
        fbState.anim = animName;
        runTimerFrames = 110;
        fbState.stm = Math.max(0, fbState.stm - cost);
        appendCombat(`[Move ${dir.toUpperCase()}] -${cost} STM (STM: ${fbState.stm})`);
        playSfx('move');

        const labels = {
          north: 'Exploring North...',
          south: 'Heading South (-STM)...',
          retreat: 'Retreating South...',
          east: 'Turning East into the wing...',
          west: 'Turning West into the wing...'
        };
        setBubble(labels[c] || 'Exploring...');

        if (fbState.stm === 0) {
          fbState.hp -= 12;
          appendCombat('[Exhausted] 0 stamina! -12 HP.');
        }
        const nr = mazeRooms[fbState.room];
        if (nr.lethal) {
          appendCombat('[LETHAL WRONG TURN] Trap triggered! Restarting level...');
          playSfx('death'); shakeFrames = 18; spawnBurst(220, 200, '#ef4444', 30);
          loadMazeLevel(fbState.lvl);
        } else if (fbState.hp <= 0) {
          appendCombat('[DEFEATED] You fell! Restarting level...');
          playSfx('death'); shakeFrames = 18;
          loadMazeLevel(fbState.lvl);
        } else if (nr.west === null && dir === 'west') {
          appendCombat('[Dead End] Dead end reached in the West! Turn East to head back.');
          playSfx('dead_end');
        }
        if (nr.item) appendCombat(` * Item here: [${nr.item}] ('take')`);
        if (nr.foe && nr.foe.hp > 0) appendCombat(` * Demon here: ${nr.foe.name} (${nr.foe.hp} HP)`);
      };

      if (c === 'north') moveDir('north', 12, 'run_north');
      else if (c === 'south' || c === 'retreat') moveDir('south', 18, 'run_south');
      else if (c === 'east') moveDir('east', 14, 'run_east');
      else if (c === 'west') moveDir('west', 14, 'run_west');
      else if (c === 'take') {
        if (r.item) {
          if (r.item === 'Torch') fbState.hasTorch = true;
          if (r.item === 'Blade') fbState.hasBlade = true;
          if (r.item === 'Herb') fbState.hasHerb = true;
          if (r.item === 'Key') fbState.hasKey = true;
          if (r.item === 'Relic') fbState.hasRelic = true;
          appendCombat(`[Acquired] Picked up ${r.item}!`);
          playSfx('win'); spawnBurst(200, 190, '#e879f9', 20);
          r.item = null;
        } else {
          appendCombat('[Info] Nothing to take here.');
        }
      } else if (c === 'rest') {
        fbState.stm = Math.min(fbState.maxStm, fbState.stm + 30);
        fbState.hp = Math.min(fbState.maxHp, fbState.hp + 10);
        appendCombat('[Rest] +30 STM, +10 HP.');
        playSfx('click');
      } else if (c === 'use herb') {
        if (fbState.hasHerb) {
          fbState.hasHerb = false;
          fbState.hp = Math.min(fbState.maxHp, fbState.hp + 45);
          appendCombat('[Herb] Healed +45 HP.');
          playSfx('win');
        } else {
          appendCombat('[!] No Herb in pack.');
        }
      } else if (c === 'slash' || c === 'attack' || c === 'vault' || c === 'guard' || c === 'torch') {
        if (r.foe && r.foe.hp > 0) {
          const dmg = (c === 'vault' ? 42 : (c === 'torch' ? 36 : 28)) + (fbState.hasBlade ? 12 : 0) + (fbState.hasRelic ? 14 : 0);
          r.foe.hp = Math.max(0, r.foe.hp - dmg);
          heroAttackFrames = 20;
          enemyHurtFrames = 20;
          fbState.anim = c === 'attack' ? 'slash' : c;
          appendCombat(`[${c.toUpperCase()}] Dealt ${dmg} DMG to ${r.foe.name}!`);
          playSfx(c === 'attack' ? 'slash' : c);
          shakeFrames = 8;
          spawnBurst(540, 195, '#fbbf24', 18);
          if (r.foe.hp > 0 && c !== 'vault') {
            const eDmg = c === 'guard' ? 10 : 20;
            fbState.hp -= eDmg;
            enemyAttackFrames = 20;
            heroHurtFrames = 20;
            appendCombat(`[${r.foe.name}] Countered for ${eDmg} DMG!`);
            if (fbState.hp <= 0) {
              appendCombat('[DEFEATED] Restarting level...');
              playSfx('death');
              loadMazeLevel(fbState.lvl);
            }
          } else if (r.foe.hp === 0) {
            appendCombat(`[Defeated] ${r.foe.name} is down!`);
          }
        } else {
          appendCombat('[Info] No demon in this chamber.');
        }
      } else if (c === 'door') {
        if (fbState.room === 'gate') {
          if (fbState.lvl < 3) {
            appendCombat(`[Gate Unlocked] Advancing to Level ${fbState.lvl + 1}!`);
            playSfx('win');
            loadMazeLevel(fbState.lvl + 1);
          } else {
            fbState.destroyed = true;
            appendCombat('*** FINAL GATE CONQUERED — VICTORY! ***');
            playSfx('win');
          }
        } else {
          appendCombat('[Info] Reach the Final Gate chamber (North) to use \'door\'.');
        }
      } else {
        appendCombat(`[Info] Command '${cmd}' executed.`);
      }

      pushFallbackState();
    }

    function submitRiddle() {
      const inp = document.getElementById('riddleAns');
      const v = inp.value.trim();
      if (!v) return;
      runAction(v);
      inp.value = '';
    }

    function submitCli() {
      const inp = document.getElementById('cliInput');
      const v = inp.value.trim();
      if (!v) return;
      runAction(v);
      inp.value = '';
    }

    function drawMazeMinimap(st) {
      const boxX = canvas.width - 196;
      const boxY = 10;
      const boxW = 186;
      const boxH = 112;

      ctx.save();
      ctx.fillStyle = 'rgba(7, 12, 20, 0.84)';
      ctx.strokeStyle = 'rgba(245, 158, 11, 0.45)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(boxX, boxY, boxW, boxH, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#fde68a';
      ctx.font = 'bold 9.5px Inter, sans-serif';
      ctx.fillText('MAZE MAP (N / S / E / W)', boxX + 9, boxY + 13);

      const cx = boxX + 96;
      const cy = boxY + 86;
      const stepX = 28;
      const stepY = 20;

      // Draw links
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
      ctx.lineWidth = 1.5;
      Object.values(mazeRooms).forEach((rm) => {
        const x1 = cx + rm.gx * stepX;
        const y1 = cy + rm.gy * stepY;
        ['north', 'south', 'east', 'west'].forEach((d) => {
          const nid = rm[d];
          if (nid && mazeRooms[nid]) {
            const nr = mazeRooms[nid];
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(cx + nr.gx * stepX, cy + nr.gy * stepY);
            ctx.stroke();
          }
        });
      });

      // Draw room nodes
      Object.entries(mazeRooms).forEach(([id, rm]) => {
        const rx = cx + rm.gx * stepX;
        const ry = cy + rm.gy * stepY;
        const isHere = st.roomId === id;
        ctx.fillStyle = isHere ? '#10b981' : (rm.lethal ? '#ef4444' : (rm.item ? '#f59e0b' : '#475569'));
        ctx.beginPath();
        ctx.arc(rx, ry, isHere ? 5.5 : 3.8, 0, Math.PI * 2);
        ctx.fill();
        if (isHere) {
          ctx.strokeStyle = '#ecfdf5';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      });

      ctx.restore();
    }

    function drawHumanCharacter(px, py, opts) {
      const { avId, hasTorch, hasBlade, hasRelic, isEvilTwist, isRunning, isAttacking, isHurt, isGuarding, dirSign, phase } = opts;
      ctx.save();
      ctx.translate(px, py);
      ctx.scale(dirSign * 1.35, 1.35);

      const swing = isRunning ? Math.sin(phase) : 0;
      const liftF = isRunning ? Math.max(0, -Math.cos(phase)) : 0;
      const liftB = isRunning ? Math.max(0, -Math.cos(phase + Math.PI)) : 0;
      if (isHurt) ctx.translate(-5, -2);

      const shGrad = ctx.createRadialGradient(0, 2, 2, 0, 2, 22);
      shGrad.addColorStop(0, 'rgba(0, 0, 0, 0.55)');
      shGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = shGrad;
      ctx.beginPath(); ctx.ellipse(0, 2, 22, 5.5, 0, 0, Math.PI * 2); ctx.fill();

      const skin = avId === 1 ? '#df9f72' : (avId === 2 ? '#f3c29b' : '#b27046');

      // Legs
      ctx.strokeStyle = '#334155'; ctx.lineWidth = 6.5;
      ctx.beginPath(); ctx.moveTo(-3, -34); ctx.lineTo(-swing * 14, -17 - liftB * 5); ctx.lineTo(-swing * 18, -liftB * 8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(3, -34); ctx.lineTo(swing * 14, -17 - liftF * 5); ctx.lineTo(swing * 18, -liftF * 8); ctx.stroke();

      // Torso
      ctx.fillStyle = isEvilTwist ? '#6d28d9' : (avId === 2 ? '#2563eb' : (avId === 3 ? '#475569' : '#334155'));
      ctx.beginPath(); ctx.roundRect(-11, -64, 22, 32, 6); ctx.fill();

      // Head & face
      ctx.fillStyle = skin;
      ctx.beginPath(); ctx.arc(1.5, -78.5, 10.5, 0, Math.PI * 2); ctx.fill();

      // Eye + brow + nose
      ctx.fillStyle = '#090d16';
      ctx.beginPath(); ctx.arc(6.8, -79.5, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#1e1b4b'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(4.2, -83); ctx.lineTo(9.5, -82.2); ctx.stroke();
      ctx.strokeStyle = '#7c2d12'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(10.5, -79.5); ctx.lineTo(12.5, -76.5); ctx.stroke();

      // Hair
      ctx.fillStyle = avId === 2 ? '#db2777' : '#29170c';
      ctx.beginPath(); ctx.arc(0, -81, 11, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();

      // Weapon arm
      const hx = isAttacking ? 34 : 14 + swing * 5;
      const hy = isAttacking ? -52 : -40;
      ctx.strokeStyle = skin; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(4, -59); ctx.lineTo(hx, hy); ctx.stroke();
      if (hasBlade || avId === 2 || avId === 3) {
        ctx.strokeStyle = isEvilTwist ? '#e879f9' : '#f8fafc';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + 16, hy - 8); ctx.stroke();
      }
      if (hasTorch) {
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath(); ctx.arc(18, -64, 6, 0, Math.PI * 2); ctx.fill();
      }
      if (hasRelic) {
        ctx.fillStyle = '#e879f9';
        ctx.beginPath(); ctx.arc(-10, -46, 6, 0, Math.PI * 2); ctx.fill();
      }
      if (isGuarding) {
        ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(16, -44, 26, -0.9, 0.9); ctx.stroke();
      }
      ctx.restore();
    }

    function drawVillainCharacter(ex, ey, kind, name, hp, maxHp, isAttacking, isHurt, phase) {
      ctx.save();
      ctx.translate(ex + (isAttacking ? -42 : 0) + (isHurt ? 12 : 0), ey);
      const pulse = Math.sin(phase) * 4;
      if (kind === 'wraith') {
        ctx.translate(0, -12 + pulse);
        ctx.fillStyle = '#312e81';
        ctx.beginPath(); ctx.moveTo(-18, 6); ctx.quadraticCurveTo(-22, -46, 0, -72); ctx.quadraticCurveTo(22, -46, 18, 6); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#38bdf8'; ctx.fillRect(-9, -54, 4, 4); ctx.fillRect(3, -54, 4, 4);
      } else if (kind === 'golem') {
        ctx.fillStyle = '#1e293b'; ctx.fillRect(-22, -74, 44, 74);
        ctx.fillStyle = '#f97316'; ctx.beginPath(); ctx.arc(0, -42, 7, 0, Math.PI * 2); ctx.fill();
      } else if (kind === 'seraph') {
        ctx.fillStyle = '#4338ca'; ctx.beginPath(); ctx.roundRect(-14, -64, 28, 38, 6); ctx.fill();
        ctx.fillStyle = '#e0e7ff'; ctx.beginPath(); ctx.arc(0, -76, 9, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = '#7c2d12'; ctx.beginPath(); ctx.ellipse(0, -34, 16, 20, 0.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#991b1b'; ctx.beginPath(); ctx.arc(-4, -58, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fef08a'; ctx.fillRect(-10, -61, 4, 4); ctx.fillRect(-2, -61, 4, 4);
      }
      ctx.restore();
      ctx.fillStyle = '#f5d0fe';
      ctx.font = 'bold 11px Inter, sans-serif';
      ctx.fillText(`${name} (${hp}/${maxHp})`, ex - 56, ey + 17);
    }

    function drawSpeechBubble(x, y, text) {
      if (!text) return;
      ctx.save();
      ctx.font = 'bold 11px Inter, sans-serif';
      const bw = Math.min(340, Math.max(120, ctx.measureText(text).width + 20));
      const bh = 25;
      const bx = Math.max(12, Math.min(canvas.width - bw - 12, x - bw * 0.4));
      const by = Math.max(8, y - bh - 10);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 8); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fef3c7';
      ctx.fillText(text, bx + 10, by + 16);
      ctx.restore();
    }

    function drawScene(st) {
      const w = canvas.width, h = canvas.height;
      const floorY = 242;
      ctx.save();
      if (shakeFrames > 0) {
        shakeFrames--;
        const mag = Math.min(9, shakeFrames * 0.65);
        ctx.translate((Math.random() - 0.5) * mag * 2, (Math.random() - 0.5) * mag * 2);
      }

      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, st.lvl === 3 ? '#1e1035' : '#0a1922');
      sky.addColorStop(1, '#11252e');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      const isRunning = runTimerFrames > 0;
      const dirSign = (facingDir === 'west' || facingDir === 'south') ? -1 : 1;
      if (isRunning) {
        scrollOffset += dirSign * 3.4;
        runTimerFrames--;
      }
      if (heroAttackFrames > 0) heroAttackFrames--;
      if (enemyAttackFrames > 0) enemyAttackFrames--;
      if (heroHurtFrames > 0) heroHurtFrames--;
      if (enemyHurtFrames > 0) enemyHurtFrames--;
      if (bubbleTimer > 0 && --bubbleTimer === 0) bubbleText = '';

      // Columns & floor
      const span = 210;
      const start = -(((scrollOffset * 0.75) % span + span) % span) - 30;
      ctx.strokeStyle = 'rgba(226, 232, 240, 0.14)';
      ctx.lineWidth = 2;
      for (let x = start; x < w + span; x += span) {
        ctx.strokeRect(x - 18, 42, 36, floorY - 42);
      }
      ctx.fillStyle = '#162330';
      ctx.fillRect(0, floorY, w, h - floorY);

      const lungeX = heroAttackFrames > 0 ? 140 : 0;
      let baseWalkX = 160;
      if (isRunning) {
        const prog = 1 - runTimerFrames / 110;
        if (facingDir === 'east') baseWalkX = 95 + prog * 180;
        else if (facingDir === 'west') baseWalkX = 260 - prog * 165;
        else baseWalkX = -30 + prog * 190;
      }
      const px = baseWalkX + lungeX;

      drawHumanCharacter(px, floorY, {
        avId: st.avId,
        hasTorch: st.hasTorch,
        hasBlade: st.hasBlade,
        hasRelic: st.hasRelic,
        isEvilTwist: st.lvl === 3,
        isRunning,
        isAttacking: heroAttackFrames > 0,
        isHurt: heroHurtFrames > 0,
        isGuarding: st.anim === 'guard' && heroAttackFrames > 0,
        dirSign,
        phase: scrollOffset * 0.16
      });

      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 11px Inter, sans-serif';
      ctx.fillText(`${runnerProfiles[st.avId].name.toUpperCase()} (${facingDir.toUpperCase()})`, px - 38, floorY + 17);

      if (!isRunning && st.foeHp > 0) {
        drawVillainCharacter(565, floorY, st.foeKind, st.foeName, st.foeHp, st.foeMaxHp, enemyAttackFrames > 0, enemyHurtFrames > 0, scrollOffset * 0.12);
      }

      if (heroAttackFrames > 10) {
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(380, 195, 62, -0.85, 0.75); ctx.stroke();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life--;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      drawSpeechBubble(px + 12, floorY - 94, bubbleText);
      drawMazeMinimap(st);
      ctx.restore();
    }

    setInterval(() => {
      if (cachedState.lvl === 3 && !cachedState.destroyed) {
        level3SecondsLeft = Math.max(0, level3SecondsLeft - 1);
        const tEl = document.getElementById('timerTag');
        if (tEl) tEl.textContent = `Time Left: ${level3SecondsLeft}s`;
      }
    }, 1000);

    var Module = {
      onRuntimeInitialized: function () {
        wasmReady = true;
        useFallback = false;
        selectRunner(1);
        newRun(1);
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      selectRunner(1);
      newRun(1);
      setTimeout(() => {
        if (!wasmReady) {
          useFallback = true;
          loadMazeLevel(1);
          pushFallbackState();
        }
      }, 200);
    });

    function loopFrame() {
      drawScene(cachedState);
      requestAnimationFrame(loopFrame);
    }
    requestAnimationFrame(loopFrame);
  </script>


  <script src="dungeon.js"></script>
</body>
</html>
