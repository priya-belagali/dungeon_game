<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eclipse of the Relic — 3-Level C++ OOP Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-0: #05080d;
      --bg-1: #0b1219;
      --bg-2: #121c27;
      --bg-3: #192635;
      --line: rgba(148, 163, 184, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --amber: #f59e0b;
      --cyan: #22d3ee;
      --crimson: #ef4444;
      --emerald: #10b981;
      --violet: #a855f7;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 0%, rgba(245, 158, 11, 0.14), transparent 45%),
        radial-gradient(ellipse at 85% 5%, rgba(168, 85, 247, 0.12), transparent 45%),
        var(--bg-0);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
    }
    .screen {
      width: 100vw;
      height: 100vh;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    header {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: 11px;
    }
    .head-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      min-width: 0;
    }
    h1 {
      margin: 0;
      font-family: 'Cinzel', serif;
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: 0.7px;
      background: linear-gradient(90deg, #fde68a, #f59e0b, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }
    .tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fde68a;
      white-space: nowrap;
    }
    .tag.timer {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.55);
      color: #fca5a5;
    }
    .hud-bars {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stat-meter {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
    }
    .bar-bg {
      width: 88px;
      height: 7px;
      background: #05070a;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-hp { height: 100%; width: 100%; background: linear-gradient(90deg, #ef4444, #f59e0b 55%, #10b981); transition: width 0.2s; }
    .bar-stm { height: 100%; width: 100%; background: linear-gradient(90deg, #0284c7, #22d3ee); transition: width 0.2s; }
    .bar-foe { height: 100%; width: 100%; background: linear-gradient(90deg, #dc2626, #a855f7); transition: width 0.2s; }

    .main-area {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 1.62fr 0.94fr;
      gap: 9px;
    }
    .stage-col {
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .canvas-wrap {
      flex: 1 1 auto;
      min-height: 0;
      background: #05080d;
      border: 1px solid var(--line);
      border-radius: 11px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #gameCanvas {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      display: block;
    }
    .goal-line {
      flex: 0 0 auto;
      padding: 5px 12px;
      background: var(--bg-2);
      border-top: 1px solid var(--line);
      font-size: 11.5px;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .goal-line strong { color: var(--amber); margin-right: 6px; }

    .log-box {
      flex: 0 0 124px;
      background: #06090f;
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 7px 12px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.36;
      white-space: pre-wrap;
      color: #e2e8f0;
    }

    .side-panel {
      min-height: 0;
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }
    .sec-hd {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .avatar-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }
    .tab-btn {
      padding: 5px 6px;
      border-radius: 7px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .tab-btn.active {
      border-color: rgba(34, 211, 238, 0.7);
      background: rgba(34, 211, 238, 0.14);
      color: #a5f3fc;
    }
    .lore-scroll {
      font-size: 10.5px;
      color: #cbd5e1;
      line-height: 1.35;
      padding: 6px 8px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(148, 163, 184, 0.12);
      max-height: 76px;
      overflow-y: auto;
    }
    .relics-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }
    .rel-pill {
      padding: 4px 2px;
      border-radius: 6px;
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      background: var(--bg-2);
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .rel-pill.got {
      color: #fde68a;
      border-color: rgba(245, 158, 11, 0.55);
      background: rgba(245, 158, 11, 0.15);
    }
    .rel-pill.relic-special.got {
      color: #e9d5ff;
      border-color: rgba(168, 85, 247, 0.7);
      background: rgba(168, 85, 247, 0.22);
    }
    .chambers-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      font-size: 10px;
    }
    .ch-cell {
      padding: 3px 5px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.02);
      color: var(--muted);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ch-cell.here {
      background: rgba(16, 185, 129, 0.2);
      color: #a7f3d0;
      font-weight: 700;
    }
    .ch-cell.locked {
      opacity: 0.45;
      text-decoration: line-through;
    }

    .dock {
      flex: 0 0 auto;
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 7px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .btn-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }
    button.m {
      background: var(--bg-2);
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.24);
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    button.m:hover:not(:disabled) { background: var(--bg-3); }
    button.m:disabled { opacity: 0.35; cursor: not-allowed; }
    button.m.atk { background: rgba(239, 68, 68, 0.16); border-color: rgba(239, 68, 68, 0.5); color: #fecaca; }
    button.m.skl { background: rgba(34, 211, 238, 0.15); border-color: rgba(34, 211, 238, 0.48); color: #a5f3fc; }
    button.m.gld { background: rgba(245, 158, 11, 0.18); border-color: rgba(245, 158, 11, 0.52); color: #fde68a; }
    button.m.grn { background: rgba(16, 185, 129, 0.16); border-color: rgba(16, 185, 129, 0.48); color: #a7f3d0; }

    .cli {
      flex: 1 1 140px;
      display: flex;
      align-items: center;
      background: #05070b;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 8px;
    }
    .cli span { color: var(--amber); font-family: monospace; font-weight: 700; margin-right: 5px; }
    .cli input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 4px 2px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <div class="head-left">
        <h1>ECLIPSE OF THE RELIC</h1>
        <span class="tag" id="lvlTag">Level 1</span>
        <span class="tag" id="roomTag">1. Courtyard</span>
        <span class="tag timer" id="timerTag" style="display:none;">Time Left: 90s</span>
        <button class="m" id="sfxBtn" onclick="toggleSfx()">SFX: ON</button>
      </div>
      <div class="hud-bars">
        <div class="stat-meter">
          <span>HP <span id="hpTxt">140</span>/<span id="maxHpTxt">140</span></span>
          <div class="bar-bg"><div class="bar-hp" id="hpBar"></div></div>
        </div>
        <div class="stat-meter">
          <span>STM <span id="stmTxt">100</span></span>
          <div class="bar-bg"><div class="bar-stm" id="stmBar"></div></div>
        </div>
        <div class="stat-meter" id="foeBarWrap" style="display:none;">
          <span style="color:#f5d0fe;"><span id="foeNameTxt">Villain</span> <span id="foeHpTxt">0</span></span>
          <div class="bar-bg"><div class="bar-foe" id="foeBar"></div></div>
        </div>
      </div>
    </header>

    <div class="main-area">
      <div class="stage-col">
        <div class="canvas-wrap">
          <canvas id="gameCanvas" width="800" height="325"></canvas>
          <div class="goal-line"><strong>HINT</strong><span id="goalTxt">Starting Level 1...</span></div>
        </div>
        <div class="log-box" id="combatLog"></div>
      </div>

      <aside class="side-panel">
        <div>
          <div class="sec-hd">Select Character &amp; Backstory</div>
          <div class="avatar-tabs">
            <button class="tab-btn active" id="tab1" onclick="selectRunner(1)">Kaelen</button>
            <button class="tab-btn" id="tab2" onclick="selectRunner(2)">Lyra</button>
            <button class="tab-btn" id="tab3" onclick="selectRunner(3)">Thorne</button>
          </div>
          <div class="lore-scroll" id="runnerLore" style="margin-top:5px;"></div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:5px;">
            <button class="m gld" onclick="newRun(1)">Lv.1 Ruins</button>
            <button class="m skl" onclick="newRun(2)">Lv.2 Relic Hunt</button>
            <button class="m atk" onclick="newRun(3)">Lv.3 Endgame</button>
          </div>
        </div>

        <div>
          <div class="sec-hd">Items &amp; Ancient Relic</div>
          <div class="relics-grid">
            <div class="rel-pill" id="relTorch">Torch</div>
            <div class="rel-pill" id="relBlade">Blade</div>
            <div class="rel-pill" id="relHerb">Herb</div>
            <div class="rel-pill" id="relKey">Key</div>
            <div class="rel-pill relic-special" id="relRelic">Relic</div>
          </div>
        </div>

        <div>
          <div class="sec-hd">6 Chambers (1 -&gt; 6 Forward Only)</div>
          <div class="chambers-grid">
            <div class="ch-cell here" id="ch1">1. Courtyard</div>
            <div class="ch-cell" id="ch2">2. East Wing</div>
            <div class="ch-cell" id="ch3">3. Gallery</div>
            <div class="ch-cell" id="ch4">4. Deep Hall</div>
            <div class="ch-cell" id="ch5">5. Sanctum</div>
            <div class="ch-cell" id="ch6">6. Final Gate</div>
          </div>
        </div>
      </aside>
    </div>

    <div class="dock">
      <div class="btn-strip">
        <button class="m atk" onclick="runAction('slash')">Slash</button>
        <button class="m skl" onclick="runAction('vault')">Vault (-25 STM)</button>
        <button class="m skl" onclick="runAction('guard')">Guard &amp; Riposte</button>
        <button class="m gld" onclick="runAction('torch')">Torch Flare (-20 STM)</button>
        <button class="m grn" onclick="runAction('rest')">Rest (+STM)</button>
        <button class="m" onclick="runAction('take')">Take</button>
        <button class="m" onclick="runAction('search')">Hint</button>
        <button class="m" onclick="runAction('use herb')">Use Herb</button>
        <button class="m" onclick="runAction('door')">Final Gate</button>
        <button class="m" id="btnNorth" onclick="runAction('north')">North</button>
        <button class="m" id="btnSouth" onclick="runAction('south')">South (-STM)</button>
        <button class="m" id="btnEast" onclick="runAction('east')">East</button>
        <button class="m" id="btnWest" onclick="runAction('west')">West</button>
        <form class="cli" onsubmit="event.preventDefault(); submitCli();">
          <span>&gt;</span>
          <input id="cliInput" type="text" placeholder="slash, vault, guard, torch, take, search, north, east..." autocomplete="off" />
        </form>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const combatLog = document.getElementById('combatLog');

    let wasmReady = false;
    let useFallback = false;
    let chosenRunner = 1;
    let scrollOffset = 0;
    let runTimerFrames = 0;
    let heroAttackFrames = 0;
    let enemyAttackFrames = 0;
    let heroHurtFrames = 0;
    let enemyHurtFrames = 0;
    let level3SecondsLeft = 90;
    let bubbleText = '';
    let bubbleTimer = 0;
    let sfxEnabled = true;
    let audioCtx = null;
    let shakeFrames = 0;
    let particles = [];
    let facingDir = 'east';

    const runnerProfiles = {
      1: {
        name: 'Kaelen',
        bio: 'Catacomb scout seeking relics that can reshape an old fate.'
      },
      2: {
        name: 'Lyra',
        bio: 'Former archivist runner pursuing hidden seals and lost artifacts.'
      },
      3: {
        name: 'Thorne',
        bio: 'Frontier veteran pushing through ancient trials toward a final reckoning.'
      }
    };

    // 6-chamber forward maze:
    // Ch.1 (cell) -> East to Ch.2 (east_wing) or North to Ch.3 (corridor)
    // Ch.2 (east_wing) -> East to Ch.3 (corridor)
    // Ch.3 (corridor) -> North to Ch.4 (forge)
    // Ch.4 (forge) -> North to Ch.5 (sanctum) or East to Ch.5 (sanctum)
    // Ch.5 (sanctum) -> North to Ch.6 (gate)
    // Ch.6 (gate) -> Final Gate
    const mazeRooms = {
      cell:      { num: 1, title: '1. Courtyard',       x: 68,  y: 92, hint: 'Steel sometimes waits off the main path.',       north: 'corridor', south: null, east: 'east_wing', west: null, item: 'Torch', foe: null },
      east_wing: { num: 2, title: '2. East Wing',       x: 138, y: 92, hint: 'A sharp edge helps before deeper halls.',       north: null,       south: null, east: 'corridor',  west: null, item: 'Blade', foe: { name: 'Demon Monkey', kind: 'monkey', hp: 64, dmg: 18 } },
      corridor:  { num: 3, title: '3. Lantern Gallery', x: 103, y: 62, hint: 'Higher chambers do not let you step back.',   north: 'forge',      south: null, east: null,        west: null, item: 'Herb',  foe: { name: 'Shadow Wraith', kind: 'wraith', hp: 88, dmg: 24 } },
      forge:     { num: 4, title: '4. Deep Hall',       x: 103, y: 34, hint: 'Ancient relics carry unseen strength.',         north: 'sanctum',    south: null, east: 'sanctum',   west: null, item: 'Relic', foe: { name: 'Obsidian Golem', kind: 'golem', hp: 94, dmg: 25 } },
      sanctum:   { num: 5, title: '5. Inner Sanctum',   x: 103, y: 14, hint: 'What opens a gate often waits just before it.', north: 'gate',       south: null, east: null,        west: null, item: 'Key',   foe: { name: 'Obsidian Golem', kind: 'golem', hp: 94, dmg: 25 } },
      gate:      { num: 6, title: '6. Final Gate',      x: 162, y: 24, hint: 'Defeat the ward and use the door once fitted.',north: null,       south: null, east: null,        west: null, item: null,    foe: { name: 'Astral Warden', kind: 'seraph', hp: 112, dmg: 28 } }
    };

    let fbState = {
      lvl: 1, room: 'cell', hp: 140, maxHp: 140, stm: 100, maxStm: 100,
      hasTorch: false, hasBlade: false, hasHerb: false, hasKey: false, hasRelic: false,
      foeHp: 0, foeMaxHp: 0, foeName: '', foeKind: '', anim: 'idle', destroyed: false, avId: 1
    };

    let cachedState = {
      roomId: 'cell', hp: 140, maxHp: 140, stm: 100, maxStm: 100,
      hasTorch: false, hasBlade: false, hasHerb: false, hasKey: false, hasRelic: false,
      foeHp: 0, foeMaxHp: 0, foeName: '', foeKind: '', mode: '', anim: 'idle',
      lvl: 1, destroyed: false, avId: 1, defeats: 0
    };

    function getAudio() {
      if (!sfxEnabled) return null;
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playHeroScream(avId = chosenRunner) {
      const ac = getAudio();
      if (!ac) return;
      const now = ac.currentTime;

      // Vocal formant scream: pitch spike followed by strained descending cry
      const basePitch = avId === 2 ? 520 : (avId === 3 ? 210 : 330);
      const peakPitch = avId === 2 ? 780 : (avId === 3 ? 340 : 510);
      const endPitch  = avId === 2 ? 290 : (avId === 3 ? 115 : 185);

      const osc1 = ac.createOscillator();
      const osc2 = ac.createOscillator();
      const filter = ac.createBiquadFilter();
      const gain = ac.createGain();

      osc1.type = 'sawtooth';
      osc2.type = 'triangle';
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(avId === 2 ? 1350 : 950, now);
      filter.Q.setValueAtTime(3.2, now);

      osc1.frequency.setValueAtTime(basePitch, now);
      osc1.frequency.exponentialRampToValueAtTime(peakPitch, now + 0.07);
      osc1.frequency.exponentialRampToValueAtTime(endPitch, now + 0.44);

      osc2.frequency.setValueAtTime(basePitch * 1.5, now);
      osc2.frequency.exponentialRampToValueAtTime(peakPitch * 1.45, now + 0.07);
      osc2.frequency.exponentialRampToValueAtTime(endPitch * 1.35, now + 0.44);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.22, now + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.46);

      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(gain);
      gain.connect(ac.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 0.47);
      osc2.stop(now + 0.47);
    }

    function playCheerfulExclamation(avId = chosenRunner) {
      const ac = getAudio();
      if (!ac) return;
      const now = ac.currentTime;
      // Cheerful two-syllable rising exclamation ("Woo-hoo!" / "Huzzah!")
      const root = avId === 2 ? 523.25 : (avId === 3 ? 329.63 : 440.0); // C5 / E4 / A4
      const notes = [
        { t: 0.00, dur: 0.13, f1: root,        f2: root * 1.25 },
        { t: 0.14, dur: 0.28, f1: root * 1.25, f2: root * 1.68 }
      ];
      notes.forEach(n => {
        const osc = ac.createOscillator();
        const sub = ac.createOscillator();
        const filter = ac.createBiquadFilter();
        const gain = ac.createGain();

        osc.type = 'triangle';
        sub.type = 'sine';
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1200, now + n.t);
        filter.Q.setValueAtTime(2.0, now + n.t);

        osc.frequency.setValueAtTime(n.f1, now + n.t);
        osc.frequency.exponentialRampToValueAtTime(n.f2, now + n.t + n.dur);
        sub.frequency.setValueAtTime(n.f1 * 2, now + n.t);
        sub.frequency.exponentialRampToValueAtTime(n.f2 * 2, now + n.t + n.dur);

        gain.gain.setValueAtTime(0.001, now + n.t);
        gain.gain.linearRampToValueAtTime(0.18, now + n.t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.dur);

        osc.connect(filter);
        sub.connect(filter);
        filter.connect(gain);
        gain.connect(ac.destination);

        osc.start(now + n.t);
        sub.start(now + n.t);
        osc.stop(now + n.t + n.dur + 0.02);
        sub.stop(now + n.t + n.dur + 0.02);
      });
    }

    function playVictoryMusic(isGrandFinale = false) {
      const ac = getAudio();
      if (!ac) return;
      const now = ac.currentTime;
      // Triumphant brass/chime victory fanfare melody
      const melody = isGrandFinale
        ? [
            { f: 523.25, t: 0.00, d: 0.16 }, // C5
            { f: 659.25, t: 0.17, d: 0.16 }, // E5
            { f: 783.99, t: 0.34, d: 0.16 }, // G5
            { f: 1046.50, t: 0.52, d: 0.34 }, // C6
            { f: 880.00, t: 0.88, d: 0.18 }, // A5
            { f: 1046.50, t: 1.08, d: 0.65 }  // C6
          ]
        : [
            { f: 440.00, t: 0.00, d: 0.14 }, // A4
            { f: 554.37, t: 0.15, d: 0.14 }, // C#5
            { f: 659.25, t: 0.30, d: 0.14 }, // E5
            { f: 880.00, t: 0.46, d: 0.48 }  // A5
          ];

      melody.forEach(note => {
        const lead = ac.createOscillator();
        const harmony = ac.createOscillator();
        const gain = ac.createGain();

        lead.type = 'triangle';
        harmony.type = 'sine';
        lead.frequency.setValueAtTime(note.f, now + note.t);
        harmony.frequency.setValueAtTime(note.f * 0.5, now + note.t);

        gain.gain.setValueAtTime(0.001, now + note.t);
        gain.gain.linearRampToValueAtTime(0.16, now + note.t + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.001, now + note.t + note.d);

        lead.connect(gain);
        harmony.connect(gain);
        gain.connect(ac.destination);

        lead.start(now + note.t);
        harmony.start(now + note.t);
        lead.stop(now + note.t + note.d + 0.02);
        harmony.stop(now + note.t + note.d + 0.02);
      });
    }

    function playSfx(type) {
      const ac = getAudio();
      if (!ac) return;
      if (type === 'scream' || type === 'hurt') {
        playHeroScream(cachedState.avId || chosenRunner);
        return;
      }
      if (type === 'cheer') {
        playCheerfulExclamation(cachedState.avId || chosenRunner);
        return;
      }
      if (type === 'level_clear') {
        playCheerfulExclamation(cachedState.avId || chosenRunner);
        setTimeout(() => playVictoryMusic(false), 260);
        return;
      }
      if (type === 'campaign_win') {
        playCheerfulExclamation(cachedState.avId || chosenRunner);
        setTimeout(() => playVictoryMusic(true), 280);
        return;
      }

      const now = ac.currentTime;
      const osc = ac.createOscillator();
      const osc2 = ac.createOscillator();
      const gain = ac.createGain();
      osc.connect(gain);
      osc2.connect(gain);
      gain.connect(ac.destination);

      const freqs = {
        slash: [640, 110],
        vault: [220, 840],
        guard: [390, 620],
        torch: [210, 60],
        move: [165, 98],
        dead_end: [240, 130],
        death: [240, 42],
        win: [440, 659],
        click: [420, 340]
      };
      const [f1, f2] = freqs[type] || [380, 320];
      osc.type = (type === 'slash' || type === 'torch' || type === 'death') ? 'sawtooth' : 'triangle';
      osc2.type = 'sine';
      osc.frequency.setValueAtTime(f1, now);
      osc.frequency.exponentialRampToValueAtTime(f2, now + 0.18);
      osc2.frequency.setValueAtTime(f1 * 0.5, now);
      osc2.frequency.exponentialRampToValueAtTime(f2 * 0.5, now + 0.18);

      gain.gain.setValueAtTime(0.13, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.start(now);
      osc2.start(now);
      osc.stop(now + 0.2);
      osc2.stop(now + 0.2);
    }

    function toggleSfx() {
      sfxEnabled = !sfxEnabled;
      const btn = document.getElementById('sfxBtn');
      if (btn) btn.textContent = sfxEnabled ? 'SFX: ON' : 'SFX: OFF';
      if (sfxEnabled) playSfx('click');
    }

    function spawnBurst(x, y, color, count = 16) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1.2 + Math.random() * 4;
        particles.push({
          x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 1,
          life: 24 + Math.floor(Math.random() * 14), maxLife: 38, color, r: 2 + Math.random() * 2.5
        });
      }
    }

    function setBubble(text, frames = 130) {
      bubbleText = text;
      bubbleTimer = frames;
    }

    function appendCombat(msg) {
      combatLog.textContent += msg + '\n';
      combatLog.scrollTop = combatLog.scrollHeight;
    }

    function loadMazeLevel(lv) {
      fbState.lvl = lv;
      fbState.room = 'cell';
      fbState.stm = 100;
      fbState.maxStm = 100;
      fbState.maxHp = fbState.avId === 2 ? 125 : (fbState.avId === 3 ? 160 : 140);
      fbState.hp = fbState.maxHp;
      fbState.destroyed = false;
      fbState.anim = 'idle';
      facingDir = 'east';
      fbState.hasTorch = false;
      fbState.hasBlade = false;
      fbState.hasHerb = false;
      fbState.hasKey = false;
      fbState.hasRelic = false;

      const s = (lv - 1) * 18;
      const d = (lv - 1) * 5;
      mazeRooms.cell.item = 'Torch';
      mazeRooms.cell.foe = null;
      mazeRooms.east_wing.item = 'Blade';
      mazeRooms.east_wing.foe = { name: 'Demon Monkey', kind: 'monkey', hp: 72 + s, dmg: 20 + d };
      mazeRooms.corridor.item = 'Herb';
      mazeRooms.corridor.foe = { name: 'Shadow Wraith', kind: 'wraith', hp: 88 + s, dmg: 24 + d };
      mazeRooms.forge.item = 'Relic';
      mazeRooms.forge.foe = { name: 'Obsidian Golem', kind: 'golem', hp: 106 + s, dmg: 27 + d };
      mazeRooms.sanctum.item = 'Key';
      mazeRooms.sanctum.foe = { name: 'Obsidian Golem', kind: 'golem', hp: 106 + s, dmg: 27 + d };
      mazeRooms.gate.item = null;
      mazeRooms.gate.foe = { name: 'Astral Warden', kind: 'seraph', hp: 126 + s, dmg: 31 + d };
    }

    function selectRunner(id) {
      fbState.avId = id;
      chosenRunner = id;
      for (let i = 1; i <= 3; i++) {
        document.getElementById('tab' + i).classList.toggle('active', i === id);
      }
      document.getElementById('runnerLore').innerHTML =
        '<strong>' + runnerProfiles[id].name + ':</strong> ' + runnerProfiles[id].bio;
      if (wasmReady && !useFallback) {
        const rName = runnerProfiles[chosenRunner].name.toLowerCase();
        Module.ccall('run_command', 'string', ['string'], [`start ${rName} level${cachedState.lvl || 1}`]);
        syncWasmState();
      } else {
        loadMazeLevel(fbState.lvl);
        pushFallbackState();
      }
    }

    function newRun(lvl) {
      runTimerFrames = 0;
      heroAttackFrames = 0;
      enemyAttackFrames = 0;
      heroHurtFrames = 0;
      enemyHurtFrames = 0;
      level3SecondsLeft = 90;
      if (wasmReady && !useFallback) {
        const rName = runnerProfiles[chosenRunner].name.toLowerCase();
        const reply = Module.ccall('run_command', 'string', ['string'], [`start ${rName} level${lvl}`]);
        combatLog.textContent = '';
        appendCombat(reply);
        syncWasmState();
      } else {
        loadMazeLevel(lvl);
        combatLog.textContent = `[Level ${lvl} — ${runnerProfiles[fbState.avId].name}] Start in Chamber 1. Higher chambers lock out going back to lower numbers.\n`;
        setBubble(`Chamber 1: ${mazeRooms.cell.hint}`);
        pushFallbackState();
      }
    }

    function pushFallbackState() {
      const r = mazeRooms[fbState.room] || mazeRooms.cell;
      const foe = r.foe && r.foe.hp > 0 ? r.foe : null;
      cachedState = {
        roomId: fbState.room,
        hp: fbState.hp,
        maxHp: fbState.maxHp,
        stm: fbState.stm,
        maxStm: fbState.maxStm,
        hasTorch: fbState.hasTorch,
        hasBlade: fbState.hasBlade,
        hasHerb: fbState.hasHerb,
        hasKey: fbState.hasKey,
        hasRelic: fbState.hasRelic,
        foeHp: foe ? foe.hp : 0,
        foeMaxHp: foe ? (75 + fbState.lvl * 14) : 0,
        foeName: foe ? foe.name : '',
        foeKind: foe ? foe.kind : '',
        mode: '',
        anim: fbState.anim,
        lvl: fbState.lvl,
        destroyed: fbState.destroyed,
        avId: fbState.avId,
        defeats: 0
      };
      renderHud(cachedState, r);
    }

    function syncWasmState() {
      const roomId = Module.ccall('current_room', 'string', [], []);
      const hp = Module.ccall('current_hp', 'number', [], []);
      const maxHp = Module.ccall('max_hp', 'number', [], []);
      const stm = Module.ccall('current_stamina', 'number', [], []);
      const maxStm = Module.ccall('max_stamina', 'number', [], []);
      const hasTorch = Module.ccall('has_torch_flag', 'number', [], []) === 1;
      const hasBlade = Module.ccall('has_blade_flag', 'number', [], []) === 1;
      const hasHerb = Module.ccall('has_herb_flag', 'number', [], []) === 1;
      const hasKey = Module.ccall('has_key_flag', 'number', [], []) === 1;
      const hasRelic = Module.ccall('has_relic_flag', 'number', [], []) === 1;
      const foeHp = Module.ccall('enemy_hp', 'number', [], []);
      const foeMaxHp = Module.ccall('enemy_max_hp', 'number', [], []);
      const foeName = Module.ccall('enemy_name', 'string', [], []);
      const foeKind = Module.ccall('enemy_kind', 'string', [], []);
      const mode = Module.ccall('prompt_mode', 'string', [], []);
      const anim = Module.ccall('last_anim', 'string', [], []);
      const lvl = Module.ccall('current_level', 'number', [], []);
      const destroyed = Module.ccall('is_world_destroyed', 'number', [], []) === 1;
      const avId = Module.ccall('current_avatar_id', 'number', [], []);
      const defeats = Module.ccall('defeats_count', 'number', [], []);

      cachedState = {
        roomId, hp, maxHp, stm, maxStm,
        hasTorch, hasBlade, hasHerb, hasKey, hasRelic,
        foeHp, foeMaxHp, foeName, foeKind, mode, anim, lvl, destroyed, avId, defeats
      };
      const r = mazeRooms[roomId] || mazeRooms.cell;
      renderHud(cachedState, r);
    }

    function renderHud(st, r) {
      document.getElementById('lvlTag').textContent = `Level ${st.lvl}`;
      document.getElementById('roomTag').textContent = r.title;

      const timerEl = document.getElementById('timerTag');
      if (st.lvl === 3 && !st.destroyed) {
        timerEl.style.display = 'inline-block';
        timerEl.textContent = `Time Left: ${level3SecondsLeft}s`;
      } else {
        timerEl.style.display = 'none';
      }

      document.getElementById('goalTxt').textContent = r.hint;

      document.getElementById('hpTxt').textContent = st.hp;
      document.getElementById('maxHpTxt').textContent = st.maxHp;
      document.getElementById('hpBar').style.width = Math.max(0, Math.min(100, (st.hp / st.maxHp) * 100)) + '%';

      document.getElementById('stmTxt').textContent = st.stm;
      document.getElementById('stmBar').style.width = Math.max(0, Math.min(100, (st.stm / st.maxStm) * 100)) + '%';

      const foeWrap = document.getElementById('foeBarWrap');
      if (st.foeHp > 0) {
        foeWrap.style.display = 'flex';
        document.getElementById('foeNameTxt').textContent = st.foeName;
        document.getElementById('foeHpTxt').textContent = `${st.foeHp}/${st.foeMaxHp}`;
        document.getElementById('foeBar').style.width = Math.max(0, Math.min(100, (st.foeHp / st.foeMaxHp) * 100)) + '%';
      } else {
        foeWrap.style.display = 'none';
      }

      document.getElementById('relTorch').classList.toggle('got', st.hasTorch);
      document.getElementById('relBlade').classList.toggle('got', st.hasBlade);
      document.getElementById('relHerb').classList.toggle('got', st.hasHerb);
      document.getElementById('relKey').classList.toggle('got', st.hasKey);
      document.getElementById('relRelic').classList.toggle('got', st.hasRelic);

      for (let i = 1; i <= 6; i++) {
        const el = document.getElementById('ch' + i);
        el.classList.toggle('here', i === r.num);
        el.classList.toggle('locked', i < r.num);
      }

      const isForwardAllowed = (targetId) => {
        if (!targetId || !mazeRooms[targetId]) return false;
        return mazeRooms[targetId].num >= r.num;
      };
      document.getElementById('btnNorth').disabled = !isForwardAllowed(r.north);
      document.getElementById('btnSouth').disabled = !isForwardAllowed(r.south);
      document.getElementById('btnEast').disabled  = !isForwardAllowed(r.east);
      document.getElementById('btnWest').disabled  = !isForwardAllowed(r.west);
    }

    function runAction(cmd) {
      const c = cmd.trim().toLowerCase();
      if (!c) return;

      if (c === 'east') facingDir = 'east';
      else if (c === 'west') facingDir = 'west';
      else if (c === 'north') facingDir = 'north';
      else if (c === 'south' || c === 'retreat') facingDir = 'south';

      if (wasmReady && !useFallback) {
        const prevRoom = Module.ccall('current_room', 'string', [], []);
        const prevHp = Module.ccall('current_hp', 'number', [], []);
        const prevFoeHp = Module.ccall('enemy_hp', 'number', [], []);
        const prevLvl = Module.ccall('current_level', 'number', [], []);
        appendCombat('> ' + cmd);
        const out = Module.ccall('run_command', 'string', ['string'], [cmd]);
        appendCombat(out);
        const nextRoom = Module.ccall('current_room', 'string', [], []);
        const nextHp = Module.ccall('current_hp', 'number', [], []);
        const nextFoeHp = Module.ccall('enemy_hp', 'number', [], []);
        const nextLvl = Module.ccall('current_level', 'number', [], []);
        const isWon = Module.ccall('is_world_destroyed', 'number', [], []) === 1;
        const anim = Module.ccall('last_anim', 'string', [], []);

        if (isWon) {
          playSfx('campaign_win');
          setBubble('Huzzah! All 3 levels conquered!');
          spawnBurst(400, 150, '#fde047', 36);
        } else if (nextLvl > prevLvl || anim === 'level_up') {
          playSfx('level_clear');
          setBubble(`Woo-hoo! Level ${nextLvl} unlocked!`);
          spawnBurst(400, 150, '#38bdf8', 28);
        } else if ((c === 'north' || c === 'south' || c === 'east' || c === 'west' || c === 'retreat') && nextRoom !== prevRoom) {
          runTimerFrames = 100;
          setBubble((mazeRooms[nextRoom] && mazeRooms[nextRoom].hint) || 'Moving forward...');
          playSfx('move');
          if (nextHp < prevHp) {
            setTimeout(() => { playSfx('scream'); setBubble('Aaargh! Exhausted!'); }, 180);
          }
        } else if (anim === 'slash' || anim === 'vault' || anim === 'guard' || anim === 'torch') {
          heroAttackFrames = 20;
          if (nextFoeHp < prevFoeHp) enemyHurtFrames = 20;
          playSfx(anim);
          shakeFrames = 8;
          spawnBurst(540, 195, '#fbbf24', 16);
          if (prevFoeHp > 0 && nextFoeHp === 0) {
            setTimeout(() => {
              playSfx('cheer');
              setBubble('Huzzah! Guardian defeated!');
              spawnBurst(540, 180, '#a855f7', 24);
            }, 220);
          } else if (nextHp < prevHp && nextFoeHp > 0) {
            setTimeout(() => {
              enemyAttackFrames = 20;
              heroHurtFrames = 20;
              playSfx('scream');
              setBubble('Aaargh! That stung!');
            }, 220);
          }
        } else {
          playSfx('click');
        }
        syncWasmState();
        return;
      }

      // Standalone 6-chamber forward maze engine
      appendCombat('> ' + cmd);
      const r = mazeRooms[fbState.room] || mazeRooms.cell;

      const moveDir = (dir, cost, animName) => {
        if (dir === 'north' && r.foe && r.foe.hp > 0) {
          appendCombat(`[Blocked] Defeat ${r.foe.name} before moving North.`);
          playSfx('dead_end');
          return;
        }
        const nextId = r[dir];
        if (!nextId || !mazeRooms[nextId]) {
          appendCombat(`[No Path] No route ${dir} from Chamber ${r.num}.`);
          playSfx('dead_end');
          return;
        }
        const nr = mazeRooms[nextId];
        if (nr.num < r.num) {
          appendCombat(`[Locked Behind] Chamber ${r.num} cannot return you to Chamber ${nr.num}.`);
          playSfx('dead_end');
          return;
        }
        fbState.room = nextId;
        fbState.anim = animName;
        runTimerFrames = 100;
        fbState.stm = Math.max(0, fbState.stm - cost);
        appendCombat(`[Move ${dir.toUpperCase()} -> Chamber ${nr.num}] -${cost} STM (STM: ${fbState.stm})`);
        playSfx('move');
        setBubble(nr.hint);

        if (fbState.stm === 0) {
          fbState.hp -= 10;
          appendCombat('[Exhausted] 0 stamina! -10 HP.');
        }
        if (fbState.hp <= 0) {
          appendCombat('[Restarted] You fell! Restarting level...');
          playSfx('death');
          loadMazeLevel(fbState.lvl);
        } else {
          if (nr.item) appendCombat(` * Found: [${nr.item}] ('take')`);
          if (nr.foe && nr.foe.hp > 0) appendCombat(` * Guardian: ${nr.foe.name} (${nr.foe.hp} HP)`);
        }
      };

      if (c === 'north') moveDir('north', 12, 'run_north');
      else if (c === 'south' || c === 'retreat') moveDir('south', 16, 'run_south');
      else if (c === 'east') moveDir('east', 12, 'run_east');
      else if (c === 'west') moveDir('west', 12, 'run_west');
      else if (c === 'take') {
        if (r.item) {
          if (r.item === 'Torch') fbState.hasTorch = true;
          if (r.item === 'Blade') fbState.hasBlade = true;
          if (r.item === 'Herb') fbState.hasHerb = true;
          if (r.item === 'Key') fbState.hasKey = true;
          if (r.item === 'Relic') fbState.hasRelic = true;
          appendCombat(`[Taken] Picked up ${r.item}!`);
          playSfx('win'); spawnBurst(200, 190, '#e879f9', 18);
          r.item = null;
        } else {
          appendCombat('[Info] Nothing here to take.');
        }
      } else if (c === 'search') {
        appendCombat(`[Hint] ${r.hint}`);
        setBubble(r.hint);
      } else if (c === 'rest') {
        fbState.stm = Math.min(fbState.maxStm, fbState.stm + 25);
        fbState.hp = Math.min(fbState.maxHp, fbState.hp + 6);
        appendCombat('[Rest] +25 STM, +6 HP.');
      } else if (c === 'use herb') {
        if (fbState.hasHerb) {
          fbState.hasHerb = false;
          fbState.hp = Math.min(fbState.maxHp, fbState.hp + 45);
          appendCombat('[Herb] +45 HP.');
        } else {
          appendCombat('[!] No Herb in pack.');
        }
      } else if (c === 'slash' || c === 'attack' || c === 'vault' || c === 'guard' || c === 'torch') {
        if (r.foe && r.foe.hp > 0) {
          if (c === 'vault' && fbState.stm < 25) {
            appendCombat('[Low STM] Need 25 STM for Vault.');
          } else if (c === 'torch' && (!fbState.hasTorch || fbState.stm < 20)) {
            appendCombat(!fbState.hasTorch ? '[No Torch] You need a Torch first.' : '[Low STM] Need 20 STM for Torch Flare.');
          } else {
            if (c === 'vault') fbState.stm -= 25;
            if (c === 'torch') fbState.stm -= 20;
            if (c === 'guard') fbState.stm = Math.min(fbState.maxStm, fbState.stm + 20);
            const basePow = (fbState.avId === 2 ? 30 : (fbState.avId === 3 ? 22 : 24)) + (fbState.lvl - 1) * 5;
            const bonus = (fbState.hasBlade ? 18 + fbState.lvl * 4 : 0) + (fbState.hasTorch ? 6 : 0) + (fbState.hasRelic ? (fbState.lvl === 3 ? 30 : 18) : 0);
            const pow = basePow + bonus;
            const dmg = c === 'vault' ? Math.floor(pow * 1.4) + 6 : (c === 'guard' ? Math.floor(pow / 2) : (c === 'torch' ? 26 + fbState.lvl * 4 : pow));
            r.foe.hp = Math.max(0, r.foe.hp - dmg);
            heroAttackFrames = 20;
            enemyHurtFrames = 20;
            fbState.anim = c === 'attack' ? 'slash' : c;
            appendCombat(`[${c.toUpperCase()}] ${dmg} DMG to ${r.foe.name}!`);
            playSfx(c === 'attack' ? 'slash' : c);
            shakeFrames = 8;
            spawnBurst(540, 195, '#fbbf24', 16);
            if (r.foe.hp > 0) {
              const eDmg = c === 'guard' ? Math.max(6, Math.floor(r.foe.dmg / 2)) : r.foe.dmg;
              fbState.hp -= eDmg;
              enemyAttackFrames = 20;
              heroHurtFrames = 20;
              appendCombat(`[${r.foe.name}] Strikes back for ${eDmg} DMG!`);
              setTimeout(() => {
                playSfx('scream');
                setBubble('Aaargh! Hold the line!');
              }, 160);
              if (fbState.hp <= 0) {
                appendCombat('[Restarted] Defeated! Restarting level...');
                playSfx('death');
                loadMazeLevel(fbState.lvl);
              }
            } else {
              appendCombat(`[Defeated] ${r.foe.name} is down!`);
              setTimeout(() => {
                playSfx('cheer');
                setBubble('Huzzah! Victory!');
                spawnBurst(540, 180, '#a855f7', 24);
              }, 180);
            }
          }
        } else {
          appendCombat('[Info] No enemy here.');
        }
      } else if (c === 'door') {
        if (fbState.room === 'gate') {
          if (r.foe && r.foe.hp > 0) {
            appendCombat(`[Gate] Defeat ${r.foe.name} first.`);
          } else if (!fbState.hasKey) {
            appendCombat('[Locked] A Key is needed to open the gate.');
          } else if (fbState.lvl < 3) {
            appendCombat(`[Cleared] Advancing to Level ${fbState.lvl + 1}!`);
            playSfx('level_clear');
            loadMazeLevel(fbState.lvl + 1);
            setBubble(`Woo-hoo! Level ${fbState.lvl} unlocked!`);
            spawnBurst(400, 150, '#38bdf8', 28);
          } else {
            fbState.destroyed = true;
            appendCombat('*** VICTORY! ALL 3 LEVELS CONQUERED! ***');
            playSfx('campaign_win');
            setBubble('Huzzah! All 3 levels conquered!');
            spawnBurst(400, 150, '#fde047', 36);
          }
        } else {
          appendCombat('[Info] Reach Chamber 6 (Final Gate) to use \'door\'.');
        }
      } else {
        appendCombat(`[Info] Command '${cmd}' executed.`);
      }

      pushFallbackState();
    }

    function submitCli() {
      const inp = document.getElementById('cliInput');
      const v = inp.value.trim();
      if (!v) return;
      runAction(v);
      inp.value = '';
    }

    function drawMazeMinimap(st) {
      const boxX = canvas.width - 214;
      const boxY = 10;
      const boxW = 204;
      const boxH = 118;

      ctx.save();
      ctx.fillStyle = 'rgba(7, 12, 20, 0.88)';
      ctx.strokeStyle = 'rgba(245, 158, 11, 0.55)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(boxX, boxY, boxW, boxH, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#fde68a';
      ctx.font = 'bold 9.5px Inter, sans-serif';
      ctx.fillText('CHAMBER MAP (1 -> 6 Forward)', boxX + 9, boxY + 13);

      const edges = [
        ['cell', 'east_wing'],
        ['cell', 'corridor'],
        ['east_wing', 'corridor'],
        ['corridor', 'forge'],
        ['forge', 'sanctum'],
        ['sanctum', 'gate']
      ];

      ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)';
      ctx.lineWidth = 1.6;
      edges.forEach(([a, b]) => {
        const ra = mazeRooms[a], rb = mazeRooms[b];
        if (!ra || !rb) return;
        ctx.beginPath();
        ctx.moveTo(boxX + ra.x, boxY + ra.y);
        ctx.lineTo(boxX + rb.x, boxY + rb.y);
        ctx.stroke();
      });

      Object.entries(mazeRooms).forEach(([id, rm]) => {
        const px = boxX + rm.x;
        const py = boxY + rm.y;
        const isHere = st.roomId === id;
        const curNum = (mazeRooms[st.roomId] && mazeRooms[st.roomId].num) || 1;
        const isBehindLocked = rm.num < curNum;
        ctx.fillStyle = isHere ? '#10b981' : (isBehindLocked ? '#1e293b' : (rm.num === 6 ? '#a855f7' : '#334155'));
        ctx.beginPath();
        ctx.arc(px, py, isHere ? 8.5 : 7.5, 0, Math.PI * 2);

        ctx.stroke();

      ctx.restore();
    }

function drawHumanCharacter(px, py, opts) {
      const {
        avId, hasTorch, hasBlade, hasRelic, isEvilTwist,
        isRunning, isAttacking, isHurt, isGuarding, dirSign, phase
      } = opts;

      ctx.save();
      ctx.translate(px, py);
      ctx.scale(dirSign * 1.38, 1.38);

      const swing = isRunning ? Math.sin(phase) : 0;
      const liftF = isRunning ? Math.max(0, -Math.cos(phase)) : 0;

      if (isHurt) {
        ctx.translate(-5, -2);
      }

      // Soft cast shadow on dungeon floor
      const shGrad = ctx.createRadialGradient(0, 2, 2, 0, 2, avId === 3 ? 28 : 22);
      shGrad.addColorStop(0, 'rgba(0, 0, 0, 0.55)');
      shGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = shGrad;
      ctx.beginPath();
      ctx.ellipse(0, 2, avId === 3 ? 28 : 22, 5.5, 0, 0, Math.PI * 2);

      const skinBase = avId === 1 ? '#df9f72' : (avId === 2 ? '#f3c29b' : '#b27046');
      const skinHi   = avId === 1 ? '#f5c7a3' : (avId === 2 ? '#ffe5ce' : '#d6976e');
      const skinLo   = avId === 1 ? '#9d5f36' : (avId === 2 ? '#be845b' : '#784222');

      function skinLinear(x1, y1, x2, y2) {
        const g = ctx.createLinearGradient(x1, y1, x2, y2);
        g.addColorStop(0, skinHi);
        g.addColorStop(0.5, skinBase);
        g.addColorStop(1, skinLo);
        return g;
      }

      function drawTaperedLimb(x1, y1, x2, y2, w1, w2, fill, strokeCol = null) {
        const dx = x2 - x1, dy = y2 - y1;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len, ny = dx / len;
        ctx.fillStyle = fill;
        ctx.beginPath();
        ctx.moveTo(x1 + nx * w1 * 0.5, y1 + ny * w1 * 0.5);
        ctx.lineTo(x2 + nx * w2 * 0.5, y2 + ny * w2 * 0.5);
        ctx.arc(x2, y2, w2 * 0.5, Math.atan2(ny, nx), Math.atan2(-ny, -nx));
        ctx.lineTo(x1 - nx * w1 * 0.5, y1 - ny * w1 * 0.5);
        ctx.arc(x1, y1, w1 * 0.5, Math.atan2(-ny, -nx), Math.atan2(ny, nx));
        ctx.closePath();
        ctx.fill();
        if (strokeCol) {
          ctx.strokeStyle = strokeCol;
          ctx.lineWidth = 1;
          ctx.stroke();

      }

      function drawRealisticHead(eyeY, irisCol, hairCol, optsFace) {

        // Realistic cranium & jaw contour
        const fGrad = ctx.createRadialGradient(4, eyeY + 1, 1.5, 1.5, eyeY + 1, 13.5);
        fGrad.addColorStop(0, skinHi);
        fGrad.addColorStop(0.65, skinBase);
        fGrad.addColorStop(1, skinLo);

        ctx.fillStyle = fGrad;
        ctx.beginPath();
        if (isBroad) {
          ctx.moveTo(-9, eyeY - 10);
          ctx.quadraticCurveTo(2, eyeY - 13, 11, eyeY - 9);
          ctx.lineTo(11.5, eyeY + 5);
          ctx.quadraticCurveTo(7, eyeY + 12.5, 1, eyeY + 11.5);
          ctx.quadraticCurveTo(-7, eyeY + 9, -9.5, eyeY + 2);
        } else if (isSlender) {
          ctx.moveTo(-8.5, eyeY - 10);

        ctx.strokeStyle = isSlender ? hairCol : '#111827';

        ctx.beginPath();
        ctx.moveTo(6.8, eyeY + 7.5);

        if (hasMustache) {

      if (avId === 1) {

    // Distinct Villain Renderers: Demon Monkey, Shadow Wraith, Obsidian Golem, Astral Warden
    function drawVillainCharacter(ex, ey, kind, name, hp, maxHp, isAttacking, isHurt, phase) {
      ctx.save();
      ctx.translate(ex + (isAttacking ? -46 : 0) + (isHurt ? 14 : 0), ey);

      const pulse = Math.sin(phase) * 4;

      if (kind === 'wraith') {

        ctx.translate(0, -14 + pulse);
        const grad = ctx.createLinearGradient(0, -78, 0, 10);
        grad.addColorStop(0, '#312e81');
        grad.addColorStop(1, 'rgba(15, 23, 42, 0.15)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(-20, 8);
        ctx.quadraticCurveTo(-24, -46, 0, -74);
        ctx.quadraticCurveTo(24, -46, 20, 8);
        ctx.lineTo(8, 0);
        ctx.lineTo(0, 10);
        ctx.lineTo(-10, 0);
        ctx.closePath();
        ctx.fill();

        // Glowing eyes
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(-11, -56, 5, 4);
        ctx.fillRect(2, -56, 5, 4);

        // Spectral claw reach
        ctx.strokeStyle = '#93c5fd';
        ctx.lineWidth = isAttacking ? 5 : 3.5;
        ctx.beginPath();
        ctx.moveTo(-14, -42);
        ctx.lineTo(isAttacking ? -48 : -28, -36);
        ctx.stroke();
      } else if (kind === 'golem') {
        // Heavy blocky Obsidian Golem with glowing core
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(-24, -76, 48, 76);
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(-24, -76, 48, 76);

        // Glowing molten chest core
        ctx.fillStyle = '#f97316';
        ctx.beginPath(); ctx.arc(0, -44, 8, 0, Math.PI * 2); ctx.fill();

        // Glowing eyes
        ctx.fillStyle = '#fb923c';
        ctx.fillRect(-12, -64, 7, 4);
        ctx.fillRect(5, -64, 7, 4);

        // Heavy stone fist
        ctx.fillStyle = '#334155';
        ctx.fillRect(isAttacking ? -52 : -36, -46, 18, 18);
      } else if (kind === 'seraph') {
        // Astral Warden with radiant halo/wings and energy spear
        ctx.fillStyle = '#1e1b4b';
        ctx.beginPath();
        ctx.moveTo(0, -58);
        ctx.lineTo(-34, -84 + pulse);
        ctx.lineTo(-22, -28);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(0, -58);
        ctx.lineTo(34, -84 - pulse);
        ctx.lineTo(22, -28);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#4338ca';
        ctx.beginPath(); ctx.roundRect(-14, -64, 28, 38, 6); ctx.fill();
        ctx.fillStyle = '#e0e7ff';
        ctx.beginPath(); ctx.arc(0, -76, 10, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#f472b6';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(0, -76, 15, 0, Math.PI * 2); ctx.stroke();

        // Spear / lance
        ctx.strokeStyle = '#f472b6';
        ctx.lineWidth = isAttacking ? 5 : 3.5;
        ctx.beginPath();
        ctx.moveTo(8, -40);
        ctx.lineTo(isAttacking ? -54 : -34, -48);
        ctx.stroke();
      } else {
        // Hunched Demon Monkey with horns & tail
        ctx.strokeStyle = '#7c2d12';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(14, -22);
        ctx.bezierCurveTo(38, -32, 36, -68, 18, -64);
        ctx.stroke();

        ctx.fillStyle = '#7c2d12';
        ctx.beginPath(); ctx.ellipse(0, -36, 17, 21, 0.2, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#991b1b';
        ctx.beginPath(); ctx.arc(-5, -62, 13, 0, Math.PI * 2); ctx.fill();

        ctx.strokeStyle = '#fde047';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-11, -72); ctx.lineTo(-17, -84);
        ctx.moveTo(2, -72); ctx.lineTo(8, -84);
        ctx.stroke();

        ctx.fillStyle = '#fef08a';
        ctx.fillRect(-13, -65, 4, 4);
        ctx.fillRect(-4, -65, 4, 4);

        ctx.strokeStyle = '#9a3412';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(-10, -45);
        ctx.lineTo(isAttacking ? -46 : -28, -24);
        ctx.stroke();
      }

      if (isAttacking) {
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(-28, -42, 22, 2.2, 4.1);
        ctx.stroke();
      }

      if (isHurt) {
        ctx.fillStyle = 'rgba(239, 68, 68, 0.45)';
        ctx.beginPath(); ctx.arc(0, -40, 26, 0, Math.PI * 2); ctx.fill();
      }

      ctx.restore();

      ctx.fillStyle = '#f5d0fe';
      ctx.font = 'bold 11px Inter, sans-serif';
      ctx.fillText(`${name} (${hp}/${maxHp})`, ex - 60, ey + 17);
    }

    function drawSpeechBubble(x, y, text) {
      if (!text) return;
      ctx.save();
      ctx.font = 'bold 11px Inter, sans-serif';
      const padX = 10;
      const metrics = ctx.measureText(text);
      const bw = Math.min(340, Math.max(120, metrics.width + padX * 2));
      const bh = 26;
      const bx = Math.max(12, Math.min(canvas.width - bw - 12, x - bw * 0.4));
      const by = Math.max(8, y - bh - 12);

      ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 8);
      ctx.fill();
      ctx.stroke();

      // Pointer tail
      ctx.beginPath();
      ctx.moveTo(bx + 24, by + bh);
      ctx.lineTo(bx + 32, by + bh + 8);
      ctx.lineTo(bx + 40, by + bh);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#fef3c7';
      ctx.fillText(text, bx + padX, by + 17);
      ctx.restore();
    }

    function drawRoomEnvironment(w, h, floorY, roomId, lvl, scroll, destroyed) {
      const sky = ctx.createLinearGradient(0, 0, 0, h);
      if (destroyed) {
        sky.addColorStop(0, '#450a0a');
        sky.addColorStop(1, '#1c0612');
      } else if (lvl === 3) {
        sky.addColorStop(0, '#1e1035');
        sky.addColorStop(1, '#0d091a');
      } else if (roomId === 'cistern') {
        sky.addColorStop(0, '#072433');
        sky.addColorStop(1, '#0c1c2c');
      } else if (roomId === 'forge') {
        sky.addColorStop(0, '#2d1208');
        sky.addColorStop(1, '#130e19');
      } else if (roomId === 'sanctum') {
        sky.addColorStop(0, '#271036');
        sky.addColorStop(1, '#0e1424');
      } else if (roomId === 'gate') {
        sky.addColorStop(0, '#0c2c47');
        sky.addColorStop(1, '#131b2e');
      } else {
        sky.addColorStop(0, '#0a1922');
        sky.addColorStop(1, '#11252e');
      }
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      // Distinct architectural props per room
      if (roomId === 'cistern') {
        // Water arches & ripples
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.arc(140 + i * 175, floorY + 18, 28, 0, Math.PI);
          ctx.stroke();
        }
      } else if (roomId === 'forge') {
        // Molten glow & glowing anvil
        const fg = ctx.createRadialGradient(450, floorY - 12, 6, 450, floorY - 12, 85);
        fg.addColorStop(0, 'rgba(251, 146, 60, 0.45)');
        fg.addColorStop(1, 'rgba(251, 146, 60, 0)');
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(450, floorY - 12, 85, 0, Math.PI * 2); ctx.fill();
      } else if (roomId === 'sanctum') {
        // Mystic pillars & rune ring
        ctx.strokeStyle = 'rgba(232, 121, 249, 0.24)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(540, 125, 58, 0, Math.PI * 2); ctx.stroke();
      } else if (roomId === 'gate') {
        // Towering double gates
        ctx.strokeStyle = 'rgba(250, 204, 21, 0.45)';
        ctx.lineWidth = 3;
        ctx.strokeRect(365, 66, 70, floorY - 66);
      }

      // Scrolling columns & floor tiles (active during North/South run)
      const span = 210;
      const start = -(((scroll * 0.75) % span + span) % span) - 30;
      ctx.strokeStyle = 'rgba(226, 232, 240, 0.13)';
      ctx.lineWidth = 2;
      for (let x = start; x < w + span; x += span) {
        ctx.strokeRect(x - 18, 42, 36, floorY - 42);
      }

      ctx.fillStyle = roomId === 'cistern' ? '#0b3246' : (lvl === 3 ? '#1c122b' : '#162330');
      ctx.fillRect(0, floorY, w, h - floorY);
      ctx.strokeStyle = lvl === 3 ? 'rgba(232, 121, 249, 0.42)' : 'rgba(245, 158, 11, 0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(w, floorY); ctx.stroke();

      const tSpan = 68;
      const tStart = -(((scroll * 2.2) % tSpan + tSpan) % tSpan);
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.16)';
      ctx.lineWidth = 1.5;
      for (let tx = tStart; tx < w + tSpan; tx += tSpan) {
        ctx.beginPath(); ctx.moveTo(tx, floorY); ctx.lineTo(tx - 20, h); ctx.stroke();
      }
    }

    
    function drawScene(st) {
      const w = canvas.width, h = canvas.height;
      const floorY = 242;
      ctx.save();
      if (shakeFrames > 0) {
        shakeFrames--;
        const mag = Math.min(9, shakeFrames * 0.65);
        ctx.translate((Math.random() - 0.5) * mag * 2, (Math.random() - 0.5) * mag * 2);
      }

      const isRunning = runTimerFrames > 0;
      const dirSign = (facingDir === 'west' || facingDir === 'south') ? -1 : 1;
      if (isRunning) {
        scrollOffset += dirSign * 3.4;
        runTimerFrames--;
      }
      if (heroAttackFrames > 0) heroAttackFrames--;
      if (enemyAttackFrames > 0) enemyAttackFrames--;
      if (heroHurtFrames > 0) heroHurtFrames--;
      if (enemyHurtFrames > 0) enemyHurtFrames--;
      if (bubbleTimer > 0 && --bubbleTimer === 0) bubbleText = '';

      drawRoomEnvironment(w, h, floorY, st.roomId, st.lvl, scrollOffset, st.destroyed);

      const lungeX = heroAttackFrames > 0 ? 140 : 0;
      let baseWalkX = 160;
      if (isRunning) {
        const prog = 1 - runTimerFrames / 100;
        if (facingDir === 'east') baseWalkX = 95 + prog * 180;
        else if (facingDir === 'west') baseWalkX = 260 - prog * 165;
        else baseWalkX = -30 + prog * 190;
      }
      const px = baseWalkX + lungeX;

      drawHumanCharacter(px, floorY, {
        avId: st.avId, hasTorch: st.hasTorch, hasBlade: st.hasBlade, hasRelic: st.hasRelic,
        isEvilTwist: st.lvl === 3, isRunning, isAttacking: heroAttackFrames > 0,
        isHurt: heroHurtFrames > 0, isGuarding: st.anim === 'guard' && heroAttackFrames > 0,
        dirSign, phase: scrollOffset * 0.16
      });

      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 11px Inter, sans-serif';
      ctx.fillText(`${runnerProfiles[st.avId].name.toUpperCase()} (${facingDir.toUpperCase()})`, px - 38, floorY + 17);

      if (!isRunning && st.foeHp > 0) {
        drawVillainCharacter(565, floorY, st.foeKind, st.foeName, st.foeHp, st.foeMaxHp, enemyAttackFrames > 0, enemyHurtFrames > 0, scrollOffset * 0.12);
      }

      if (heroAttackFrames > 10) {
        ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(380, 195, 62, -0.85, 0.75); ctx.stroke();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life--;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      drawSpeechBubble(px + 12, floorY - 94, bubbleText);
      drawMazeMinimap(st);
      ctx.restore();
    }

    setInterval(() => {
      if (cachedState.lvl === 3 && !cachedState.destroyed) {
        level3SecondsLeft = Math.max(0, level3SecondsLeft - 1);
        const tEl = document.getElementById('timerTag');
        if (tEl) tEl.textContent = `Time Left: ${level3SecondsLeft}s`;
      }
    }, 1000);

    var Module = {
      onRuntimeInitialized: function () {
        wasmReady = true;
        useFallback = false;
        selectRunner(1);
        newRun(1);
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      selectRunner(1);
      newRun(1);
      setTimeout(() => {
        if (!wasmReady) {
          useFallback = true;
          loadMazeLevel(1);
          pushFallbackState();
        }
      }, 200);
    });

    function loopFrame() {
      drawScene(cachedState);
      requestAnimationFrame(loopFrame);
    }
    requestAnimationFrame(loopFrame);
  </script>
  <script src="dungeon.js"></script>
</body>
</html>
