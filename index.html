<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eclipse of the Relic — 3-Level C++ OOP Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-0: #05080d;
      --bg-1: #0b1219;
      --bg-2: #121c27;
      --bg-3: #192635;
      --line: rgba(148, 163, 184, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --amber: #f59e0b;
      --cyan: #22d3ee;
      --crimson: #ef4444;
      --emerald: #10b981;
      --violet: #a855f7;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 0%, rgba(245, 158, 11, 0.14), transparent 45%),
        radial-gradient(ellipse at 85% 5%, rgba(168, 85, 247, 0.12), transparent 45%),
        var(--bg-0);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
    }
    .screen {
      width: 100vw;
      height: 100vh;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    header {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: 11px;
    }
    .head-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      min-width: 0;
    }
    h1 {
      margin: 0;
      font-family: 'Cinzel', serif;
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: 0.7px;
      background: linear-gradient(90deg, #fde68a, #f59e0b, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }
    .tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fde68a;
      white-space: nowrap;
    }
    .tag.timer {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.55);
      color: #fca5a5;
    }
    .hud-bars {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stat-meter {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
    }
    .bar-bg {
      width: 88px;
      height: 7px;
      background: #05070a;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-hp { height: 100%; width: 100%; background: linear-gradient(90deg, #ef4444, #f59e0b 55%, #10b981); transition: width 0.2s; }
    .bar-stm { height: 100%; width: 100%; background: linear-gradient(90deg, #0284c7, #22d3ee); transition: width 0.2s; }
    .bar-foe { height: 100%; width: 100%; background: linear-gradient(90deg, #dc2626, #a855f7); transition: width 0.2s; }

    .main-area {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 1.62fr 0.94fr;
      gap: 9px;
    }
    .stage-col {
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .canvas-wrap {
      flex: 1 1 auto;
      min-height: 0;
      background: #05080d;
      border: 1px solid var(--line);
      border-radius: 11px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #gameCanvas {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      display: block;
    }
    .goal-line {
      flex: 0 0 auto;
      padding: 5px 12px;
      background: var(--bg-2);
      border-top: 1px solid var(--line);
      font-size: 11.5px;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .goal-line strong { color: var(--amber); margin-right: 6px; }

    .log-box {
      flex: 0 0 124px;
      background: #06090f;
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 7px 12px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.36;
      white-space: pre-wrap;
      color: #e2e8f0;
    }

    .side-panel {
      min-height: 0;
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }
    .sec-hd {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .avatar-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }
    .tab-btn {
      padding: 5px 6px;
      border-radius: 7px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .tab-btn.active {
      border-color: rgba(34, 211, 238, 0.7);
      background: rgba(34, 211, 238, 0.14);
      color: #a5f3fc;
    }
    .lore-scroll {
      font-size: 10.5px;
      color: #cbd5e1;
      line-height: 1.35;
      padding: 6px 8px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(148, 163, 184, 0.12);
      max-height: 76px;
      overflow-y: auto;
    }
    .relics-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }
    .rel-pill {
      padding: 4px 2px;
      border-radius: 6px;
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      background: var(--bg-2);
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .rel-pill.got {
      color: #fde68a;
      border-color: rgba(245, 158, 11, 0.55);
      background: rgba(245, 158, 11, 0.15);
    }
    .rel-pill.relic-special.got {
      color: #e9d5ff;
      border-color: rgba(168, 85, 247, 0.7);
      background: rgba(168, 85, 247, 0.22);
    }
    .chambers-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      font-size: 10px;
    }
    .ch-cell {
      padding: 3px 5px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.02);
      color: var(--muted);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ch-cell.here {
      background: rgba(16, 185, 129, 0.2);
      color: #a7f3d0;
      font-weight: 700;
    }

    .dock {
      flex: 0 0 auto;
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 7px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .riddle-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 4px 9px;
      border-radius: 7px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.45);
      font-size: 11px;
      color: #fde68a;
    }
    .riddle-bar.open { display: flex; }
    .riddle-bar input {
      flex: 1;
      max-width: 220px;
      background: #05070b;
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: var(--text);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11.5px;
      outline: none;
    }
    .btn-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }
    button.m {
      background: var(--bg-2);
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.24);
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    button.m:hover { background: var(--bg-3); }
    button.m.atk { background: rgba(239, 68, 68, 0.16); border-color: rgba(239, 68, 68, 0.5); color: #fecaca; }
    button.m.skl { background: rgba(34, 211, 238, 0.15); border-color: rgba(34, 211, 238, 0.48); color: #a5f3fc; }
    button.m.gld { background: rgba(245, 158, 11, 0.18); border-color: rgba(245, 158, 11, 0.52); color: #fde68a; }
    button.m.grn { background: rgba(16, 185, 129, 0.16); border-color: rgba(16, 185, 129, 0.48); color: #a7f3d0; }

    .cli {
      flex: 1 1 140px;
      display: flex;
      align-items: center;
      background: #05070b;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 8px;
    }
    .cli span { color: var(--amber); font-family: monospace; font-weight: 700; margin-right: 5px; }
    .cli input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 4px 2px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <div class="head-left">
        <h1>ECLIPSE OF THE RELIC</h1>
        <span class="tag" id="lvlTag">Level 1</span>
        <span class="tag" id="roomTag">1. Sunlit Courtyard</span>
        <span class="tag timer" id="timerTag" style="display:none;">Clock: 90s</span>
      </div>
      <div class="hud-bars">
        <div class="stat-meter">
          <span>HP <span id="hpTxt">140</span>/<span id="maxHpTxt">140</span></span>
          <div class="bar-bg"><div class="bar-hp" id="hpBar"></div></div>
        </div>
        <div class="stat-meter">
          <span>STM <span id="stmTxt">100</span></span>
          <div class="bar-bg"><div class="bar-stm" id="stmBar"></div></div>
        </div>
        <div class="stat-meter" id="foeBarWrap" style="display:none;">
          <span style="color:#f5d0fe;"><span id="foeNameTxt">Villain</span> <span id="foeHpTxt">0</span></span>
          <div class="bar-bg"><div class="bar-foe" id="foeBar"></div></div>
        </div>
      </div>
    </header>

    <div class="main-area">
      <div class="stage-col">
        <div class="canvas-wrap">
          <canvas id="gameCanvas" width="800" height="325"></canvas>
          <div class="goal-line"><strong>OBJECTIVE</strong><span id="goalTxt">Starting Level 1...</span></div>
        </div>
        <div class="log-box" id="combatLog"></div>
      </div>

      <aside class="side-panel">
        <div>
          <div class="sec-hd">Select Character &amp; Backstory</div>
          <div class="avatar-tabs">
            <button class="tab-btn active" id="tab1" onclick="selectRunner(1)">Kaelen</button>
            <button class="tab-btn" id="tab2" onclick="selectRunner(2)">Lyra</button>
            <button class="tab-btn" id="tab3" onclick="selectRunner(3)">Thorne</button>
          </div>
          <div class="lore-scroll" id="runnerLore" style="margin-top:5px;"></div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:5px;">
            <button class="m gld" onclick="newRun(1)">Lv.1 Ruins</button>
            <button class="m skl" onclick="newRun(2)">Lv.2 Relic Hunt</button>
            <button class="m atk" onclick="newRun(3)">Lv.3 Endgame</button>
          </div>
        </div>

        <div>
          <div class="sec-hd">Items &amp; Ancient Relic</div>
          <div class="relics-grid">
            <div class="rel-pill" id="relTorch">Torch</div>
            <div class="rel-pill" id="relBlade">Blade</div>
            <div class="rel-pill" id="relHerb">Herb</div>
            <div class="rel-pill" id="relKey">Key</div>
            <div class="rel-pill relic-special" id="relRelic">Relic</div>
          </div>
        </div>

        <div>
          <div class="sec-hd">6 Chambers</div>
          <div class="chambers-grid">
            <div class="ch-cell here" id="ch1">1. Start</div>
            <div class="ch-cell" id="ch2">2. Gallery</div>
            <div class="ch-cell" id="ch3">3. Cistern</div>
            <div class="ch-cell" id="ch4">4. Forge</div>
            <div class="ch-cell" id="ch5">5. Sanctum</div>
            <div class="ch-cell" id="ch6">6. Final Gate</div>
          </div>
        </div>
      </aside>
    </div>

    <div class="dock">
      <div class="riddle-bar" id="riddleBar">
        <span id="riddlePrompt">Challenge active:</span>
        <input id="riddleAns" type="text" placeholder="Type move or answer..." />
        <button class="m gld" onclick="submitRiddle()">Submit</button>
      </div>

      <div class="btn-strip">
        <button class="m atk" onclick="runAction('slash')">Slash</button>
        <button class="m skl" onclick="runAction('vault')">Vault (-25 STM)</button>
        <button class="m skl" onclick="runAction('guard')">Guard &amp; Riposte</button>
        <button class="m gld" onclick="runAction('torch')">Torch Flare (-20 STM)</button>
        <button class="m grn" onclick="runAction('rest')">Rest (+STM)</button>
        <button class="m" onclick="runAction('take')">Take</button>
        <button class="m" onclick="runAction('search')">Inspect / Riddle</button>
        <button class="m" onclick="runAction('use herb')">Use Herb</button>
        <button class="m" onclick="runAction('door')">Final Gate</button>
        <button class="m" onclick="runAction('north')">North</button>
        <button class="m" onclick="runAction('south')">South</button>
        <form class="cli" onsubmit="event.preventDefault(); submitCli();">
          <span>&gt;</span>
          <input id="cliInput" type="text" placeholder="slash, vault, guard, torch, take, search, north..." autocomplete="off" />
        </form>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const combatLog = document.getElementById('combatLog');
    let wasmReady = false;
    let chosenRunner = 1;
    let scrollOffset = 0;
    let runTimerFrames = 0;
    let heroAttackFrames = 0;
    let enemyAttackFrames = 0;
    let heroHurtFrames = 0;
    let enemyHurtFrames = 0;
    let level3SecondsLeft = 90;
    let bubbleText = '';
    let bubbleTimer = 0;

    let cachedState = {
      roomId: 'cell',
      hp: 140,
      maxHp: 140,
      stm: 100,
      maxStm: 100,
      hasTorch: false,
      hasBlade: false,
      hasHerb: false,
      hasKey: false,
      hasRelic: false,
      foeHp: 0,
      foeMaxHp: 0,
      foeName: '',
      foeKind: '',
      mode: '',
      anim: 'idle',
      lvl: 1,
      destroyed: false,
      avId: 1,
      defeats: 0
    };

    const runnerProfiles = {
      1: {
        name: 'Kaelen',
        bio: 'Kaelen is a seasoned ruin-delver with dark wavy hair, a leather vest, and a warm amber scarf. Beneath his calm explorer mask hides a cold obsession with forbidden relics.'
      },
      2: {
        name: 'Lyra',
        bio: 'Lyra is an agile arcane courier with long braided crimson-violet hair, silver trim, and sharp reflexes—driven by secrets that turn darker as the Relic awakens.'
      },
      3: {
        name: 'Thorne',
        bio: 'Thorne is a tall, broad-shouldered veteran with a trimmed beard, dark steel pauldrons, and an emerald cloak—whose stoic patience conceals a plan to remake the world in ash.'
      }
    };

    const chamberMap = {
      cell:     { label: '1. Start Chamber', goal: 'Advance North to continue the mission.', idx: 1 },
      corridor: { label: '2. Gallery',       goal: 'Fight the villain, inspect for Key, and move North.', idx: 2 },
      cistern:  { label: '3. Cistern',       goal: 'Defeat the wraith & inspect to solve Riddle I.', idx: 3 },
      forge:    { label: '4. Forge',         goal: 'Claim items/Relic, defeat the golem & inspect for Riddle III.', idx: 4 },
      sanctum:  { label: '5. Sanctum',       goal: 'Inspect braziers (Riddle II) & defeat the guardian.', idx: 5 },
      gate:     { label: '6. Final Gate',    goal: 'Use Key & solve the Final Riddle to complete the stage.', idx: 6 }
    };

    function setBubble(text, frames = 150) {
      bubbleText = text;
      bubbleTimer = frames;
    }

    function selectRunner(id) {
      chosenRunner = id;
      for (let i = 1; i <= 3; i++) {
        document.getElementById('tab' + i).classList.toggle('active', i === id);
      }
      document.getElementById('runnerLore').innerHTML =
        '<strong>' + runnerProfiles[id].name + ':</strong> ' + runnerProfiles[id].bio;
    }

    function appendCombat(msg) {
      combatLog.textContent += msg + '\n';
      combatLog.scrollTop = combatLog.scrollHeight;
    }

    function newRun(lvl) {
      if (!wasmReady) return;
      const rName = runnerProfiles[chosenRunner].name.toLowerCase();
      const reply = Module.ccall('run_command', 'string', ['string'], [`start ${rName} level${lvl}`]);
      combatLog.textContent = '';
      appendCombat(reply);
      runTimerFrames = 0;
      heroAttackFrames = 0;
      enemyAttackFrames = 0;
      heroHurtFrames = 0;
      enemyHurtFrames = 0;
      level3SecondsLeft = 90;
      if (lvl === 1) setBubble('Starting Level 1. Let us explore!');
      else if (lvl === 2) setBubble('Level 2: I must find the Ancient Relic!');
      else setBubble('Hehe... now I have the Relic. The world will burn!');
      syncState();
    }

    // Human-like character with distinct facial features, hair, neck, shoulders, torso, arms, legs, and outfits
    function drawHumanCharacter(px, py, opts) {
      const {
        avId, hasTorch, hasBlade, hasRelic, isEvilTwist,
        isRunning, isAttacking, isHurt, isGuarding, dirSign, phase
      } = opts;

      ctx.save();
      ctx.translate(px, py);
      ctx.scale(dirSign, 1);

      const swing = isRunning ? Math.sin(phase) : 0;
      const liftF = isRunning ? Math.max(0, -Math.cos(phase)) * 7 : 0;
      const liftB = isRunning ? Math.max(0, -Math.cos(phase + Math.PI)) * 7 : 0;

      // Distinct human looks per avatar
      const skin = avId === 1 ? '#e8b288' : (avId === 2 ? '#f4c7a1' : '#c68b63');
      const hairColor = avId === 1 ? '#291d18' : (avId === 2 ? '#be185d' : '#1e293b');
      const outfitMain = isEvilTwist
        ? '#4c1d95'
        : (avId === 1 ? '#2b3a4a' : (avId === 2 ? '#1d4ed8' : '#374151'));
      const trimColor = isEvilTwist
        ? '#e879f9'
        : (avId === 1 ? '#f59e0b' : (avId === 2 ? '#22d3ee' : '#10b981'));

      if (isHurt) {
        ctx.translate(-5, -2);
      }

      // Back Leg (hip -> knee -> ankle/boot)
      const bKneeX = -swing * 9;
      const bFootX = -swing * 16;
      const bFootY = -liftB;
      ctx.strokeStyle = '#1f2937';
      ctx.lineWidth = avId === 3 ? 8.5 : 6.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(-2, -28);
      ctx.lineTo(bKneeX, -14 - liftB * 0.5);
      ctx.lineTo(bFootX, bFootY);
      ctx.stroke();

      // Back Arm
      ctx.strokeStyle = skin;
      ctx.lineWidth = avId === 3 ? 7.5 : 5.5;
      ctx.beginPath();
      ctx.moveTo(-3, -55);
      ctx.lineTo(-4 + swing * 12, -36);
      ctx.stroke();

      // Cloak / Scarf
      ctx.fillStyle = trimColor;
      ctx.beginPath();
      ctx.moveTo(-5, -58);
      ctx.lineTo(-27, -38 + (isRunning ? Math.sin(phase * 1.4) * 5 : 0));
      ctx.lineTo(-21, -24 + (isRunning ? Math.sin(phase * 1.4) * 5 : 0));
      ctx.lineTo(-3, -34);
      ctx.closePath();
      ctx.fill();

      // Human Torso (shoulders & chest)
      const halfChest = avId === 3 ? 15 : (avId === 2 ? 10.5 : 12);
      ctx.fillStyle = outfitMain;
      ctx.beginPath();
      ctx.roundRect(-halfChest, -60, halfChest * 2, 34, 8);
      ctx.fill();

      // Belt & chest emblem
      ctx.fillStyle = trimColor;
      ctx.fillRect(-halfChest, -30, halfChest * 2, 4.5);

      // Front Leg
      const fKneeX = swing * 9;
      const fFootX = swing * 16;
      const fFootY = -liftF;
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = avId === 3 ? 8.5 : 6.5;
      ctx.beginPath();
      ctx.moveTo(2, -28);
      ctx.lineTo(fKneeX, -14 - liftF * 0.5);
      ctx.lineTo(fFootX, fFootY);
      ctx.stroke();

      // Boots
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(fFootX - 3, fFootY - 5, 11, 5);
      ctx.fillRect(bFootX - 3, bFootY - 5, 11, 5);

      // Neck
      ctx.fillStyle = skin;
      ctx.fillRect(-4, -66, 8, 7);

      // Human Head (oval face + nose + eye + eyebrow + mouth)
      ctx.fillStyle = skin;
      ctx.beginPath();
      ctx.ellipse(1, -76, 10.5, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      // Facial features
      ctx.fillStyle = isEvilTwist ? '#f0abfc' : '#0f172a';
      ctx.beginPath();
      ctx.arc(6, -77, 2.2, 0, Math.PI * 2); // eye
      ctx.fill();

      // Eyebrow (angled menacingly if evil twist or attacking)
      ctx.strokeStyle = hairColor;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      if (isEvilTwist || isAttacking) {
        ctx.moveTo(3, -81); ctx.lineTo(9, -79);
      } else {
        ctx.moveTo(3, -80); ctx.lineTo(9, -81);
      }
      ctx.stroke();

      // Nose bridge
      ctx.strokeStyle = 'rgba(15, 23, 42, 0.45)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(9, -77); ctx.lineTo(11.5, -74); ctx.lineTo(9, -73);
      ctx.stroke();

      // Distinct Hairstyles per Avatar
      ctx.fillStyle = hairColor;
      if (avId === 1) {
        // Kaelen: tousled adventurer hair
        ctx.beginPath();
        ctx.ellipse(0, -83, 12, 6, -0.15, 0, Math.PI * 2);
        ctx.fill();
      } else if (avId === 2) {
        // Lyra: swept bangs + flowing high ponytail
        ctx.beginPath();
        ctx.ellipse(0, -84, 11.5, 5.5, 0, 0, Math.PI * 2);
        ctx.moveTo(-8, -82);
        ctx.quadraticCurveTo(-26, -78 + (isRunning ? Math.sin(phase) * 5 : 0), -28, -56);
        ctx.lineTo(-14, -62);
        ctx.fill();
      } else {
        // Thorne: short cropped hair + full beard
        ctx.beginPath();
        ctx.rect(-10, -87, 21, 7);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(3, -70, 8.5, 0.1, Math.PI * 0.92);
        ctx.fill();
      }

      // Front Arm + Active Weapon / Relic
      const reachX = isAttacking ? 34 : 13;
      const reachY = isAttacking ? -52 : -42 - swing * 6;
      ctx.strokeStyle = skin;
      ctx.lineWidth = avId === 3 ? 7.5 : 5.5;
      ctx.beginPath();
      ctx.moveTo(4, -55);
      ctx.lineTo(reachX, reachY);
      ctx.stroke();

      if (hasBlade) {
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = isAttacking ? 5 : 3.2;
        ctx.beginPath();
        ctx.moveTo(reachX, reachY);
        ctx.lineTo(reachX + (isAttacking ? 34 : 16), reachY - (isAttacking ? 6 : 22));
        ctx.stroke();
        if (isAttacking) {
          ctx.strokeStyle = 'rgba(34, 211, 238, 0.7)';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(reachX + 18, reachY - 4, 24, -0.7, 0.7);
          ctx.stroke();
        }
      }

      if (hasTorch) {
        ctx.strokeStyle = '#92400e';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(reachX, reachY);
        ctx.lineTo(reachX + 10, reachY - 16);
        ctx.stroke();
        const fg = ctx.createRadialGradient(reachX + 10, reachY - 20, 2, reachX + 10, reachY - 20, 24);
        fg.addColorStop(0, '#fef08a');
        fg.addColorStop(0.5, 'rgba(245, 158, 11, 0.75)');
        fg.addColorStop(1, 'rgba(245, 158, 11, 0)');
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(reachX + 10, reachY - 20, 24, 0, Math.PI * 2); ctx.fill();
      }

      if (hasRelic) {
        const rg = ctx.createRadialGradient(-8, -44, 2, -8, -44, 22);
        rg.addColorStop(0, '#f5d0fe');
        rg.addColorStop(0.5, 'rgba(168, 85, 247, 0.65)');
        rg.addColorStop(1, 'rgba(168, 85, 247, 0)');
        ctx.fillStyle = rg;
        ctx.beginPath(); ctx.arc(-8, -44, 22, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e879f9';
        ctx.beginPath(); ctx.arc(-8, -44, 6, 0, Math.PI * 2); ctx.fill();
      }

      if (isGuarding) {
        ctx.strokeStyle = '#22d3ee';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(16, -44, 28, -0.9, 0.9); ctx.stroke();
      }

      if (isHurt) {
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-16, -65); ctx.lineTo(14, -30);
        ctx.stroke();
      }

      ctx.restore();
    }

    // Distinct Villain Renderers: Demon Monkey, Shadow Wraith, Obsidian Golem, Astral Warden
    function drawVillainCharacter(ex, ey, kind, name, hp, maxHp, isAttacking, isHurt, phase) {
      ctx.save();
      ctx.translate(ex + (isAttacking ? -46 : 0) + (isHurt ? 14 : 0), ey);

      const pulse = Math.sin(phase) * 4;

      if (kind === 'wraith') {
        // Floating hooded Shadow Wraith with spectral scythe/claws
        ctx.translate(0, -14 + pulse);
        const grad = ctx.createLinearGradient(0, -78, 0, 10);
        grad.addColorStop(0, '#312e81');
        grad.addColorStop(1, 'rgba(15, 23, 42, 0.15)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(-20, 8);
        ctx.quadraticCurveTo(-24, -46, 0, -74);
        ctx.quadraticCurveTo(24, -46, 20, 8);
        ctx.lineTo(8, 0);
        ctx.lineTo(0, 10);
        ctx.lineTo(-10, 0);
        ctx.closePath();
        ctx.fill();

        // Glowing eyes
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(-11, -56, 5, 4);
        ctx.fillRect(2, -56, 5, 4);

        // Spectral claw reach
        ctx.strokeStyle = '#93c5fd';
        ctx.lineWidth = isAttacking ? 5 : 3.5;
        ctx.beginPath();
        ctx.moveTo(-14, -42);
        ctx.lineTo(isAttacking ? -48 : -28, -36);
        ctx.stroke();
      } else if (kind === 'golem') {
        // Heavy blocky Obsidian Golem with glowing core
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(-24, -76, 48, 76);
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(-24, -76, 48, 76);

        // Glowing molten chest core
        ctx.fillStyle = '#f97316';
        ctx.beginPath(); ctx.arc(0, -44, 8, 0, Math.PI * 2); ctx.fill();

        // Glowing eyes
        ctx.fillStyle = '#fb923c';
        ctx.fillRect(-12, -64, 7, 4);
        ctx.fillRect(5, -64, 7, 4);

        // Heavy stone fist
        ctx.fillStyle = '#334155';
        ctx.fillRect(isAttacking ? -52 : -36, -46, 18, 18);
      } else if (kind === 'seraph') {
        // Astral Warden with radiant halo/wings and energy spear
        ctx.fillStyle = '#1e1b4b';
        ctx.beginPath();
        ctx.moveTo(0, -58);
        ctx.lineTo(-34, -84 + pulse);
        ctx.lineTo(-22, -28);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(0, -58);
        ctx.lineTo(34, -84 - pulse);
        ctx.lineTo(22, -28);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#4338ca';
        ctx.beginPath(); ctx.roundRect(-14, -64, 28, 38, 6); ctx.fill();
        ctx.fillStyle = '#e0e7ff';
        ctx.beginPath(); ctx.arc(0, -76, 10, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#f472b6';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(0, -76, 15, 0, Math.PI * 2); ctx.stroke();

        // Spear / lance
        ctx.strokeStyle = '#f472b6';
        ctx.lineWidth = isAttacking ? 5 : 3.5;
        ctx.beginPath();
        ctx.moveTo(8, -40);
        ctx.lineTo(isAttacking ? -54 : -34, -48);
        ctx.stroke();
      } else {
        // Hunched Demon Monkey with horns & tail
        ctx.strokeStyle = '#7c2d12';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(14, -22);
        ctx.bezierCurveTo(38, -32, 36, -68, 18, -64);
        ctx.stroke();

        ctx.fillStyle = '#7c2d12';
        ctx.beginPath(); ctx.ellipse(0, -36, 17, 21, 0.2, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#991b1b';
        ctx.beginPath(); ctx.arc(-5, -62, 13, 0, Math.PI * 2); ctx.fill();

        ctx.strokeStyle = '#fde047';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-11, -72); ctx.lineTo(-17, -84);
        ctx.moveTo(2, -72); ctx.lineTo(8, -84);
        ctx.stroke();

        ctx.fillStyle = '#fef08a';
        ctx.fillRect(-13, -65, 4, 4);
        ctx.fillRect(-4, -65, 4, 4);

        ctx.strokeStyle = '#9a3412';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(-10, -45);
        ctx.lineTo(isAttacking ? -46 : -28, -24);
        ctx.stroke();
      }

      if (isAttacking) {
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(-28, -42, 22, 2.2, 4.1);
        ctx.stroke();
      }

      if (isHurt) {
        ctx.fillStyle = 'rgba(239, 68, 68, 0.45)';
        ctx.beginPath(); ctx.arc(0, -40, 26, 0, Math.PI * 2); ctx.fill();
      }

      ctx.restore();

      ctx.fillStyle = '#f5d0fe';
      ctx.font = 'bold 11px Inter, sans-serif';
      ctx.fillText(`${name} (${hp}/${maxHp})`, ex - 60, ey + 17);
    }

    function drawSpeechBubble(x, y, text) {
      if (!text) return;
      ctx.save();
      ctx.font = 'bold 11px Inter, sans-serif';
      const padX = 10;
      const metrics = ctx.measureText(text);
      const bw = Math.min(340, Math.max(120, metrics.width + padX * 2));
      const bh = 26;
      const bx = Math.max(12, Math.min(canvas.width - bw - 12, x - bw * 0.4));
      const by = Math.max(8, y - bh - 12);

      ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 8);
      ctx.fill();
      ctx.stroke();

      // Pointer tail
      ctx.beginPath();
      ctx.moveTo(bx + 24, by + bh);
      ctx.lineTo(bx + 32, by + bh + 8);
      ctx.lineTo(bx + 40, by + bh);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#fef3c7';
      ctx.fillText(text, bx + padX, by + 17);
      ctx.restore();
    }

    function drawRoomEnvironment(w, h, floorY, roomId, lvl, scroll, destroyed) {
      const sky = ctx.createLinearGradient(0, 0, 0, h);
      if (destroyed) {
        sky.addColorStop(0, '#450a0a');
        sky.addColorStop(1, '#1c0612');
      } else if (lvl === 3) {
        sky.addColorStop(0, '#1e1035');
        sky.addColorStop(1, '#0d091a');
      } else if (roomId === 'cistern') {
        sky.addColorStop(0, '#072433');
        sky.addColorStop(1, '#0c1c2c');
      } else if (roomId === 'forge') {
        sky.addColorStop(0, '#2d1208');
        sky.addColorStop(1, '#130e19');
      } else if (roomId === 'sanctum') {
        sky.addColorStop(0, '#271036');
        sky.addColorStop(1, '#0e1424');
      } else if (roomId === 'gate') {
        sky.addColorStop(0, '#0c2c47');
        sky.addColorStop(1, '#131b2e');
      } else {
        sky.addColorStop(0, '#0a1922');
        sky.addColorStop(1, '#11252e');
      }
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      // Distinct architectural props per room
      if (roomId === 'cistern') {
        // Water arches & ripples
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.arc(140 + i * 175, floorY + 18, 28, 0, Math.PI);
          ctx.stroke();
        }
      } else if (roomId === 'forge') {
        // Molten glow & glowing anvil
        const fg = ctx.createRadialGradient(450, floorY - 12, 6, 450, floorY - 12, 85);
        fg.addColorStop(0, 'rgba(251, 146, 60, 0.45)');
        fg.addColorStop(1, 'rgba(251, 146, 60, 0)');
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(450, floorY - 12, 85, 0, Math.PI * 2); ctx.fill();
      } else if (roomId === 'sanctum') {
        // Mystic pillars & rune ring
        ctx.strokeStyle = 'rgba(232, 121, 249, 0.24)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(540, 125, 58, 0, Math.PI * 2); ctx.stroke();
      } else if (roomId === 'gate') {
        // Towering double gates
        ctx.strokeStyle = 'rgba(250, 204, 21, 0.45)';
        ctx.lineWidth = 3;
        ctx.strokeRect(365, 66, 70, floorY - 66);
      }

      // Scrolling columns & floor tiles (active during North/South run)
      const span = 210;
      const start = -(((scroll * 0.75) % span + span) % span) - 30;
      ctx.strokeStyle = 'rgba(226, 232, 240, 0.13)';
      ctx.lineWidth = 2;
      for (let x = start; x < w + span; x += span) {
        ctx.strokeRect(x - 18, 42, 36, floorY - 42);
      }

      ctx.fillStyle = roomId === 'cistern' ? '#0b3246' : (lvl === 3 ? '#1c122b' : '#162330');
      ctx.fillRect(0, floorY, w, h - floorY);
      ctx.strokeStyle = lvl === 3 ? 'rgba(232, 121, 249, 0.42)' : 'rgba(245, 158, 11, 0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(w, floorY); ctx.stroke();

      const tSpan = 68;
      const tStart = -(((scroll * 2.2) % tSpan + tSpan) % tSpan);
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.16)';
      ctx.lineWidth = 1.5;
      for (let tx = tStart; tx < w + tSpan; tx += tSpan) {
        ctx.beginPath(); ctx.moveTo(tx, floorY); ctx.lineTo(tx - 20, h); ctx.stroke();
      }
    }

    function drawScene(st) {
      const w = canvas.width, h = canvas.height;
      const {
        roomId, avId, hasTorch, hasBlade, hasRelic,
        foeHp, foeMaxHp, foeName, foeKind, anim, lvl, destroyed
      } = st;

      const isRunning = runTimerFrames > 0;
      const dirSign = (anim === 'run_south') ? -1 : 1;
      const speed = isRunning ? (anim === 'run_south' ? -3.0 : 3.0) : 0;
      scrollOffset += speed;

      if (isRunning) {
        runTimerFrames--;
        if (runTimerFrames === 0 && bubbleTimer <= 0) {
          if (foeHp > 0) setBubble(`A ${foeName} blocks the way! Let's fight!`);
          else if (roomId === 'forge' && lvl === 2 && !hasRelic) setBubble('There it is... the Ancient Relic!');
          else setBubble('All clear for now. What next?');
        }
      }

      if (heroAttackFrames > 0) heroAttackFrames--;
      if (enemyAttackFrames > 0) enemyAttackFrames--;
      if (heroHurtFrames > 0) heroHurtFrames--;
      if (enemyHurtFrames > 0) enemyHurtFrames--;
      if (bubbleTimer > 0) {
        bubbleTimer--;
        if (bubbleTimer === 0) bubbleText = '';
      }

      const floorY = 242;
      drawRoomEnvironment(w, h, floorY, roomId, lvl, scrollOffset, destroyed);

      const isEvilTwist = (lvl === 3);
      const lungeX = heroAttackFrames > 0 ? 150 : 0;
      const px = (isRunning ? (-35 + (1 - runTimerFrames / 120) * 195) : 160) + lungeX;
      const py = floorY;

      drawHumanCharacter(px, py, {
        avId,
        hasTorch,
        hasBlade,
        hasRelic,
        isEvilTwist,
        isRunning,
        isAttacking: heroAttackFrames > 0,
        isHurt: heroHurtFrames > 0,
        isGuarding: anim === 'guard' && heroAttackFrames > 0,
        dirSign,
        phase: scrollOffset * 0.16
      });

      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 11px Inter, sans-serif';
      ctx.fillText(runnerProfiles[avId].name.toUpperCase() + (isEvilTwist ? ' [VILLAIN]' : ''), px - 34, floorY + 17);

      // Villains appear after running into a chamber
      if (!isRunning && foeHp > 0) {
        drawVillainCharacter(
          565, floorY, foeKind, foeName, foeHp, foeMaxHp,
          enemyAttackFrames > 0, enemyHurtFrames > 0, scrollOffset * 0.12
        );
      }

      // Speech / thought bubble near character
      drawSpeechBubble(px + 12, py - 94, bubbleText);

      if (destroyed) {
        ctx.fillStyle = 'rgba(239, 68, 68, 0.22)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#fecaca';
        ctx.font = 'bold 16px Cinzel, serif';
        ctx.fillText('WORLD DESTROYED — YOU WIN!', 245, 42);
      }
    }

    function syncRiddleBar(mode) {
      const bar = document.getElementById('riddleBar');
      const txt = document.getElementById('riddlePrompt');
      const inp = document.getElementById('riddleAns');
      const prompts = {
        trap:         'Hazard active — type move (slide, leap, brace):',
        crevice:      'Niche active — type side (left or right):',
        riddle_bell:  'Riddle I active — type your answer:',
        riddle_forge: 'Riddle III active — type your answer:',
        brazier:      'Riddle II active — type your answer:',
        riddle_gate:  'Final Riddle active — type your answer:'
      };
      if (prompts[mode]) {
        bar.classList.add('open');
        txt.textContent = prompts[mode];
        inp.focus();
      } else {
        bar.classList.remove('open');
        inp.value = '';
      }
    }

    function syncState() {
      const roomId = Module.ccall('current_room', 'string', [], []);
      const hp = Module.ccall('current_hp', 'number', [], []);
      const maxHp = Module.ccall('max_hp', 'number', [], []);
      const stm = Module.ccall('current_stamina', 'number', [], []);
      const maxStm = Module.ccall('max_stamina', 'number', [], []);
      const hasTorch = Module.ccall('has_torch_flag', 'number', [], []) === 1;
      const hasBlade = Module.ccall('has_blade_flag', 'number', [], []) === 1;
      const hasHerb = Module.ccall('has_herb_flag', 'number', [], []) === 1;
      const hasKey = Module.ccall('has_key_flag', 'number', [], []) === 1;
      const hasRelic = Module.ccall('has_relic_flag', 'number', [], []) === 1;
      const foeHp = Module.ccall('enemy_hp', 'number', [], []);
      const foeMaxHp = Module.ccall('enemy_max_hp', 'number', [], []);
      const foeName = Module.ccall('enemy_name', 'string', [], []);
      const foeKind = Module.ccall('enemy_kind', 'string', [], []);
      const mode = Module.ccall('prompt_mode', 'string', [], []);
      const anim = Module.ccall('last_anim', 'string', [], []);
      const lvl = Module.ccall('current_level', 'number', [], []);
      const destroyed = Module.ccall('is_world_destroyed', 'number', [], []) === 1;
      const avId = Module.ccall('current_avatar_id', 'number', [], []);
      const defeats = Module.ccall('defeats_count', 'number', [], []);

      cachedState = {
        roomId, hp, maxHp, stm, maxStm,
        hasTorch, hasBlade, hasHerb, hasKey, hasRelic,
        foeHp, foeMaxHp, foeName, foeKind, mode, anim, lvl, destroyed, avId, defeats
      };

      const cInfo = chamberMap[roomId] || { label: roomId, goal: '', idx: 1 };
      document.getElementById('lvlTag').textContent = `Level ${lvl}`;
      document.getElementById('roomTag').textContent = cInfo.label;

      const timerEl = document.getElementById('timerTag');
      if (lvl === 3 && !destroyed) {
        timerEl.style.display = 'inline-block';
        timerEl.textContent = `Time Left: ${level3SecondsLeft}s`;
      } else {
        timerEl.style.display = 'none';
      }

      let goalText = cInfo.goal;
      if (lvl === 2) goalText = 'Mission Lv.2: Claim the magical Relic in the Forge & reach the Final Gate.';
      if (lvl === 3) goalText = 'Mission Lv.3 (Villain Twist, Timed!): Use the Relic to reach & unlock the Final Gate to destroy the world!';
      document.getElementById('goalTxt').textContent = goalText;

      document.getElementById('hpTxt').textContent = hp;
      document.getElementById('maxHpTxt').textContent = maxHp;
      document.getElementById('hpBar').style.width = Math.max(0, Math.min(100, (hp / maxHp) * 100)) + '%';

      document.getElementById('stmTxt').textContent = stm;
      document.getElementById('stmBar').style.width = Math.max(0, Math.min(100, (stm / maxStm) * 100)) + '%';

      const foeWrap = document.getElementById('foeBarWrap');
      if (foeHp > 0) {
        foeWrap.style.display = 'flex';
        document.getElementById('foeNameTxt').textContent = foeName;
        document.getElementById('foeHpTxt').textContent = `${foeHp}/${foeMaxHp}`;
        document.getElementById('foeBar').style.width = Math.max(0, Math.min(100, (foeHp / foeMaxHp) * 100)) + '%';
      } else {
        foeWrap.style.display = 'none';
      }

      document.getElementById('relTorch').classList.toggle('got', hasTorch);
      document.getElementById('relBlade').classList.toggle('got', hasBlade);
      document.getElementById('relHerb').classList.toggle('got', hasHerb);
      document.getElementById('relKey').classList.toggle('got', hasKey);
      document.getElementById('relRelic').classList.toggle('got', hasRelic);

      for (let i = 1; i <= 6; i++) {
        document.getElementById('ch' + i).classList.toggle('here', i === cInfo.idx);
      }

      syncRiddleBar(mode);
      drawScene(cachedState);
    }

    function runAction(cmd) {
      if (!wasmReady) return;
      const prevRoom = Module.ccall('current_room', 'string', [], []);
      const prevLvl = Module.ccall('current_level', 'number', [], []);
      const prevHp = Module.ccall('current_hp', 'number', [], []);
      const prevFoeHp = Module.ccall('enemy_hp', 'number', [], []);

      appendCombat('> ' + cmd);
      const out = Module.ccall('run_command', 'string', ['string'], [cmd]);
      appendCombat(out);

      const nextRoom = Module.ccall('current_room', 'string', [], []);
      const nextLvl = Module.ccall('current_level', 'number', [], []);
      const nextHp = Module.ccall('current_hp', 'number', [], []);
      const nextFoeHp = Module.ccall('enemy_hp', 'number', [], []);
      const anim = Module.ccall('last_anim', 'string', [], []);
      const norm = cmd.trim().toLowerCase();

      if (nextLvl !== prevLvl) {
        runTimerFrames = 0;
        if (nextLvl === 2) {
          setBubble('Level 2: Time to claim that magical Relic!');
        } else if (nextLvl === 3) {
          level3SecondsLeft = 90;
          setBubble('Plot twist! I am the villain—I will destroy the world with this Relic!');
        }
      } else if ((norm === 'north' || norm === 'south' || norm === 'retreat') && nextRoom !== prevRoom) {
        runTimerFrames = 120;
        setBubble(norm === 'south' ? 'Heading back South...' : 'Running North...');
      } else if (anim === 'slash' || anim === 'vault' || anim === 'guard' || anim === 'torch') {
        heroAttackFrames = 22;
        if (nextFoeHp < prevFoeHp) enemyHurtFrames = 22;
        if (nextHp < prevHp && nextFoeHp > 0) {
          setTimeout(() => { enemyAttackFrames = 22; heroHurtFrames = 22; }, 220);
          setBubble('Oof! That hurt—stay sharp!');
        } else if (nextFoeHp === 0 && prevFoeHp > 0) {
          setBubble('Down they go! Moving on.');
        } else {
          setBubble('Take this!');
        }
      } else if (nextHp < prevHp) {
        heroHurtFrames = 22;
        setBubble('Ouch! That took a toll on me.');
      } else if (anim === 'relic_found') {
        setBubble('The Ancient Relic is mine! Unlimited dark power!');
      } else if (anim === 'take') {
        setBubble('Found something useful!');
      } else if (anim === 'apocalypse') {
        setBubble('The world is shattered! My master plan is complete!');
      }

      syncState();
    }

    function submitRiddle() {
      const inp = document.getElementById('riddleAns');
      const v = inp.value.trim();
      if (!v) return;
      runAction(v);
      inp.value = '';
    }

    function submitCli() {
      const inp = document.getElementById('cliInput');
      const v = inp.value.trim();
      if (!v) return;
      runAction(v);
      inp.value = '';
    }

    setInterval(() => {
      if (!wasmReady) return;
      if (cachedState.lvl === 3 && !cachedState.destroyed) {
        level3SecondsLeft = Math.max(0, level3SecondsLeft - 1);
        document.getElementById('timerTag').textContent = `Time Left: ${level3SecondsLeft}s`;
        if (level3SecondsLeft === 0) {
          const out = Module.ccall('run_command', 'string', ['string'], ['timeout']);
          appendCombat(out);
          level3SecondsLeft = 90;
          setBubble('Too slow! Resetting Level 3 clock...');
          syncState();
        }
      }
    }, 1000);

    var Module = {
      onRuntimeInitialized: function () {
        wasmReady = true;
        selectRunner(1);
        newRun(1);
      }
    };

    function loopFrame() {
      drawScene(cachedState);
      requestAnimationFrame(loopFrame);
    }
    requestAnimationFrame(loopFrame);
  </script>
  <script src="dungeon.js"></script>
</body>
</html>
